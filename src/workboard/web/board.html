      <button class="btn icon" id="board-menu" title="Board options" aria-label="Board options" aria-haspopup="menu"><svg class="i"><use href="#i-more"/></svg></button>
    </header>
    <div id="banner-slot"></div>
    <div class="filterbar" id="filterbar"></div>
    <div class="content" id="content">
      <div class="board" id="board" aria-label="Board"></div>
      <div id="view-host"></div>
    </div>
  </main>
</div>

<aside class="panel" id="panel" aria-label="Card details" role="dialog" aria-modal="false"></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
// ═════════════════════════════════════════════════════════════════════
// WorkBoard core — state, server sync, board rendering, drag and drop,
// dialogs/menus/toasts and app chrome. Modules (panel.js, views.js) use the
// WB API defined here; see the module contract.
// ═════════════════════════════════════════════════════════════════════
const WB = window.WB = {};
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (sel, root = document) => root.querySelector(sel);
  const CORE = ['backlog', 'task', 'inprogress', 'done', 'blocked'];
  const store = {
    get(key, fallback = null) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch { return fallback; } },
    set(key, value) { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch { /* storage unavailable */ } },
    json(key, fallback) { try { return JSON.parse(store.get(key)) ?? fallback; } catch { return fallback; } },
  };
  // Board pages live at <root>b/<name>/ and address their board page-relative
  // (api/..., events, board.json). The hub (<root>) has no board.
  const ROUTE = location.pathname.match(/^(.*?\/)b\/([^/]+)\/$/);
  const ROOT = ROUTE ? ROUTE[1] : location.pathname.replace(/[^/]*$/, '');
  const BOARD = ROUTE ? decodeURIComponent(ROUTE[2]) : null;
  const boardUrl = name => `${ROOT}b/${encodeURIComponent(name)}/`;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  // ── State ──────────────────────────────────────────────────────────
  const S = WB.state = {
    doc: null, rev: 0, actor: store.get('workboard.previewActor', 'user'),
    view: 'board', selectedId: null, live: 'connecting', missing: false,
    filters: { status: new Set(), priority: new Set(), owner: new Set(), outcome: new Set(), tags: new Set(), rework: '' },
    search: '', zoom: Number(store.get('workboard.ui.zoom', '1')) || 1,
  };
  let byId = new Map(), byNum = new Map();
  const listeners = new Map();
  WB.on = (event, fn) => {
    if (!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(fn);
    return () => listeners.get(event).delete(fn);
  };
  const emit = (event, data) => { for (const fn of listeners.get(event) || []) { try { fn(data); } catch (err) { console.error(err); } } };

  WB.card = ref => {
    if (ref == null) return null;
    if (typeof ref === 'number') return byNum.get(ref) || null;
    const s = String(ref).trim().replace(/^#/, '');
    return byId.get(s) || (/^\d+$/.test(s) ? byNum.get(Number(s)) : null) || null;
  };
  WB.cards = () => (S.doc ? S.doc.cards : []);
  WB.columns = () => (S.doc ? S.doc.columns : []);
  WB.colName = id => (WB.columns().find(c => c.id === id)?.name) || ({ backlog: 'Backlog', task: 'Task', inprogress: 'In Progress', done: 'Done', blocked: 'Blocked' })[id] || id;
  const boardKey = suffix => `workboard.ui.${suffix}::${BOARD}`;

  function setDoc(doc, meta = {}) {
    const prev = S.doc;
    S.doc = doc; S.rev = doc.rev; S.missing = false;
    byId = new Map(); byNum = new Map();
    for (const c of doc.cards) { byId.set(c.id, c); byNum.set(c.num, c); }
    if (S.selectedId && !byId.has(S.selectedId) && WB.panel) WB.panel.update();
    emit('doc', { doc, prev, meta });
    scheduleRender(meta);
  }

  // ── Derived facts ──────────────────────────────────────────────────
  const depsSatisfied = card => (card.dependsOn || []).every(id => {
    const d = byId.get(id);
    return d && d.column === 'done' && d.outcome === 'completed';
  });
  const isReady = c => c.column === 'task' && !c.activeOwner && depsSatisfied(c);
  const inRework = c => !!c.reworkReason && c.column !== 'done';
  const subtaskStats = card => {
    let done = 0, total = 0;
    const walk = list => { for (const s of list || []) { total++; if (s.done) done++; walk(s.children); } };
    walk(card.subtasks);
    return { done, total };
  };
  WB.facts = { depsSatisfied, isReady, inRework, subtaskStats };

  WB.matches = card => {
    const f = S.filters;
    if (f.status.size && !f.status.has(card.column)) return false;
    if (f.priority.size && !f.priority.has(card.priority || 'none')) return false;
    if (f.owner.size && !f.owner.has(card.activeOwner || '__unowned')) return false;
    if (f.outcome.size && !f.outcome.has(card.outcome || 'open')) return false;
    if (f.rework === 'yes' && !inRework(card)) return false;
    if (f.rework === 'no' && inRework(card)) return false;
    if (f.tags.size && !(card.tags || []).some(t => f.tags.has(t))) return false;
    if (S.search) {
      const q = S.search.toLowerCase();
      if (!searchText(card).includes(q)) return false;
    }
    return true;
  };
  const searchCache = new WeakMap();
  function searchText(card) {
    let s = searchCache.get(card);
    if (!s) {
      const parts = [`#${card.num}`, card.title, card.code, card.origin, card.notes, card.writeup, ...(card.tags || [])];
      const walk = list => { for (const t of list || []) { parts.push(t.text); walk(t.children); } };
      walk(card.subtasks);
      for (const m of card.comments || []) parts.push(m.text);
      for (const e of card.log || []) parts.push(e.summary, e.body);
      s = parts.filter(Boolean).join('\n').toLowerCase();
      searchCache.set(card, s);
    }
    return s;
  }
  const filtersActive = () => S.search || S.filters.rework || ['status', 'priority', 'owner', 'outcome', 'tags'].some(k => S.filters[k].size);

  // ── DOM helpers ────────────────────────────────────────────────────
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'attrs') for (const [a, b] of Object.entries(v)) { if (b != null && b !== false) el.setAttribute(a, b === true ? '' : b); }
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'style') Object.assign(el.style, v);
        else if (k === 'on') for (const [e, fn] of Object.entries(v)) el.addEventListener(e, fn);
        else if (k in el) el[k] = v;
        else el.setAttribute(k, v);
      }
    }
    append(el, children);
    return el;
  }
  function append(el, children) {
    for (const child of children) {
      if (child == null || child === false) continue;
      if (Array.isArray(child)) append(el, child);
      else el.append(child instanceof Node ? child : String(child));
    }
  }
  function icon(name, cls = '') {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', cls ? `i ${cls}` : 'i');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', `#i-${name}`);
    svg.append(use);
    return svg;
  }
  const TONES = ['#e5484d', '#e38b18', '#1e9e5a', '#0091b3', '#3b82f6', '#6e56cf', '#c2298a', '#7c7f86'];
  const toneFor = label => { let n = 0; for (const ch of String(label)) n = (n * 31 + ch.charCodeAt(0)) >>> 0; return TONES[n % TONES.length]; };
  const initials = label => {
    const words = String(label || '?').replace(/([a-z])([A-Z])/g, '$1 $2').split(/[\s._-]+/).filter(Boolean);
    return ((words[0]?.[0] || '?') + (words.length > 1 ? words[1][0] : '')).toUpperCase();
  };
  const avatar = (label, cls = '') => h('span', { class: `avatar ${cls}`.trim(), style: { '--tone': toneFor(label) }, title: label, text: initials(label) });
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function relTime(iso) {
    if (!iso) return '';
    const t = Date.parse(iso); if (Number.isNaN(t)) return '';
    const s = (Date.now() - t) / 1000;
    if (s < 45) return 'now';
    if (s < 3600) return `${Math.round(s / 60)}m`;
    if (s < 86400) return `${Math.round(s / 3600)}h`;
    if (s < 86400 * 30) return `${Math.round(s / 86400)}d`;
    const d = new Date(t), y = new Date().getFullYear();
    return `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear() === y ? '' : `, ${d.getFullYear()}`}`;
  }
  const fmtDate = iso => { const d = new Date(iso); return Number.isNaN(+d) ? '' : `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
  const fmtDateTime = iso => { const d = new Date(iso); return Number.isNaN(+d) ? '' : `${fmtDate(iso)}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const statusDot = col => h('span', { class: 'dot', dataset: { status: col } });
  const prio = p => h('span', { class: 'prio', dataset: { p: p || 'none' }, title: p ? `Priority: ${p}` : 'No priority' }, h('i'), h('i'), h('i'));
  const chip = (text, { onRemove, tone } = {}) => h('span', { class: 'chip', style: tone ? { '--tone': tone } : null },
    tone ? h('span', { class: 'dot' }) : null, text,
    onRemove ? h('button', { type: 'button', attrs: { 'aria-label': `Remove ${text}` }, on: { click: e => { e.stopPropagation(); onRemove(); } } }, icon('x', 'sm')) : null);
  const progress = (done, total) => {
    const bar = h('span', { class: 'progress' }, h('i', { style: { transform: `scaleX(${total ? done / total : 0})` } }));
    if (total && done === total) bar.style.setProperty('--tone', 'var(--green)');
    return bar;
  };

  // ── Layers (menus, dialogs, palette) and toasts ────────────────────
  const layers = [];
  const pushLayer = layer => { layers.push(layer); return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); }; };
  function leave(el, then) {
    el.classList.add('out');
    const done = () => { el.remove(); then?.(); };
    if (reduceMotion.matches) done(); else setTimeout(done, 130);
  }

  function toast(message, { action, error = false, ms = 3600 } = {}) {
    const host = $('#toasts');
    const el = h('div', { class: `toast${error ? ' error' : ''}`, attrs: { role: error ? 'alert' : 'status' } }, h('span', { text: message }));
    let timer;
    const close = () => { clearTimeout(timer); if (el.isConnected) leave(el); };
    if (action) el.append(h('button', { class: 'btn xs', text: action.label, on: { click: () => { close(); action.run(); } } }));
    host.append(el);
    while (host.children.length > 3) host.firstElementChild.remove();
    timer = setTimeout(close, error ? Math.max(ms, 6000) : ms);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(close, 1800); });
    return close;
  }

  function menu(anchor, items, { align = 'start', keepOpen = false, onClose } = {}) {
    const pop = h('div', { class: 'pop', attrs: { role: 'menu' } });
    const buttons = [];
    for (const item of items) {
      if (!item) continue;
      if (item === 'sep') { pop.append(h('div', { class: 'menu-sep' })); continue; }
      if (item.header) { pop.append(h('div', { class: 'menu-label', text: item.header })); continue; }
      if (item.node) { pop.append(item.node); continue; }
      const btn = h('button', {
        class: `menu-item${item.danger ? ' danger' : ''}`, type: 'button', disabled: item.disabled,
        attrs: { role: item.checked === undefined ? 'menuitem' : 'menuitemcheckbox', 'aria-checked': item.checked === undefined ? null : String(!!item.checked) },
      }, item.iconNode || (item.icon ? icon(item.icon) : null), h('span', { text: item.label }), item.hint ? h('span', { class: 'hint', text: item.hint }) : null);
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (item.keep || keepOpen) { item.run?.(btn); return; }
        close(); item.run?.();
      });
      buttons.push(btn); pop.append(btn);
    }
    document.body.append(pop);
    const vw = innerWidth, vh = innerHeight;
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x, y, origin;
    if (anchor instanceof Element) {
      const r = anchor.getBoundingClientRect();
      x = align === 'end' ? r.right - pw : r.left; y = r.bottom + 6; origin = align === 'end' ? 'top right' : 'top left';
      if (y + ph > vh - 8 && r.top - ph - 6 > 8) { y = r.top - ph - 6; origin = origin.replace('top', 'bottom'); }
    } else { x = anchor.x; y = anchor.y; origin = 'top left'; if (y + ph > vh - 8) y = Math.max(8, vh - ph - 8); }
    x = Math.max(8, Math.min(x, vw - pw - 8)); y = Math.max(8, y);
    Object.assign(pop.style, { left: `${x}px`, top: `${y}px`, '--origin': origin });
    let active = -1;
    const focusItem = i => { active = (i + buttons.length) % buttons.length; buttons.forEach((b, j) => b.classList.toggle('active', j === active)); buttons[active]?.focus({ preventScroll: true }); };
    const onKey = e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(active - 1); }
    };
    const onDown = e => { if (!pop.contains(e.target) && !(anchor instanceof Element && anchor.contains(e.target))) close(); };
    pop.addEventListener('keydown', onKey);
    setTimeout(() => document.addEventListener('pointerdown', onDown, true));
    let closed = false;
    const unlayer = pushLayer({ close: () => close() });
    function close() {
      if (closed) return; closed = true;
      unlayer(); document.removeEventListener('pointerdown', onDown, true);
      leave(pop); onClose?.();
      if (anchor instanceof Element) anchor.setAttribute('aria-expanded', 'false');
    }
    if (anchor instanceof Element) anchor.setAttribute('aria-expanded', 'true');
    return { close, el: pop };
  }

  function dialog({ title, body, fields = [], ok = 'Confirm', danger = false, cancel = 'Cancel' }) {
    return new Promise(resolve => {
      const back = document.activeElement;
      const scrim = h('div', { class: 'scrim' });
      const inputs = {};
      const form = h('form', { class: 'dialog', attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-label': title } });
      form.append(h('h2', { text: title }));
      if (body) form.append(h('p', { text: body }));
      for (const f of fields) {
        const id = `dlg-${f.name}`;
        let input;
        if (f.options) input = h('select', { class: 'input', id }, f.options.map(o => h('option', { value: o.value, text: o.label, selected: o.value === f.value })));
        else if (f.multiline) input = h('textarea', { class: 'input', id, rows: 3, placeholder: f.placeholder || '', value: f.value || '', style: { height: 'auto', padding: '8px 10px', resize: 'vertical', fieldSizing: 'content', minHeight: '72px', maxHeight: '40vh' } });
        else input = h('input', { class: 'input', id, type: f.type || 'text', placeholder: f.placeholder || '', value: f.value || '' });
        inputs[f.name] = input;
        form.append(h('label', { attrs: { for: id }, text: f.label }), input);
      }
      const okBtn = h('button', { class: `btn ${danger ? 'danger outline' : 'primary'}`, type: 'submit', text: ok });
      form.append(h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', text: cancel, on: { click: () => finish(null) } }), okBtn));
      const validate = () => { okBtn.disabled = fields.some(f => f.required && !String(inputs[f.name].value).trim()); };
      form.addEventListener('input', validate); validate();
      form.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
      });
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (okBtn.disabled) return;
        const values = {};
        for (const f of fields) values[f.name] = f.options ? inputs[f.name].value : String(inputs[f.name].value).trim();
        finish(values);
      });
      scrim.addEventListener('pointerdown', () => finish(null));
      const unlayer = pushLayer({ close: () => finish(null) });
      let done = false;
      function finish(value) {
        if (done) return; done = true; unlayer();
        leave(form); leave(scrim);
        back?.focus?.({ preventScroll: true });
        resolve(value);
      }
      document.body.append(scrim, form);
      (Object.values(inputs)[0] || okBtn).focus();
    });
  }
  const confirm = ({ title, body, ok = 'Confirm', danger = false }) => dialog({ title, body, ok, danger }).then(v => v !== null);
  const prompt = opts => dialog(opts);

  WB.ui = { h, icon, toast, menu, confirm, prompt, avatar, tone: toneFor, relTime, fmtDate, fmtDateTime, statusDot, prio, chip, progress, reconcile, renderCard: card => cardElement(card, false) };

  // ── Server API ─────────────────────────────────────────────────────
  async function request(method, path, { body, headers = {}, raw = false } = {}) {
    const init = { method, headers: { ...headers }, cache: 'no-store' };
    if (body !== undefined) {
      if (raw) init.body = body;
      else { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    }
    const res = await fetch(path, init);
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
    if (!res.ok) {
      const err = new Error(data?.error || `${res.status} ${res.statusText}`);
      err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }
  let writeChain = Promise.resolve();
  const serial = fn => { const p = writeChain.then(fn, fn); writeChain = p.catch(() => {}); return p; };
  function write(method, path, payloadFn, { raw, headers, quiet } = {}) {
    return serial(async () => {
      try {
        const res = raw
          ? await request(method, path, { body: raw, raw: true, headers: { ...headers, 'X-Board-Base-Rev': String(S.rev), 'X-WorkBoard-Actor': encodeURIComponent(S.actor) } })
          : await request(method, path, { body: { baseRev: S.rev, actor: S.actor, ...payloadFn() } });
        if (res?.document) setDoc(res.document, { source: 'self' });
        return { ok: true, res };
      } catch (err) {
        reportWriteError(err, quiet);
        return { ok: false, status: err.status, error: err.message, data: err.data };
      }
    });
  }
  function reportWriteError(err, quiet) {
    if (err.status === 410 || isUnregistered(err)) { enterMissing(isUnregistered(err)); return; }
    if (err.status === 409 && err.data?.conflict && err.data?.rev != null) {
      toast('The board changed while you were working, so this change was not saved. Latest state loaded — try again.', { error: true, ms: 7000 });
      refresh();
      return;
    }
    if (!quiet) toast(err.message || 'Save failed', { error: true });
    if (err.status === 409 || err.status === 422) refresh();
  }
  const enc = s => encodeURIComponent(s);
  const isUnregistered = err => err.status === 404 && err.data?.error === 'unknown_board';
  WB.api = {
    get: path => request('GET', path),
    patchCard: (id, fields, { position } = {}) => write('PATCH', `api/card/${enc(id)}`, () => ({ card: fields, ...(position ? { position } : {}) })),
    lifecycle: (id, action, details = {}) => write('PATCH', `api/card/${enc(id)}/lifecycle`, () => ({ action, details })),
    structure: operation => write('PATCH', 'api/structure', () => ({ operation })),
    comment: (id, operation) => write('PATCH', `api/card/${enc(id)}/comments`, () => ({ operation })),
    upload: (id, file) => {
      if (file.size > 10 * 1024 * 1024) { toast(`${file.name} is larger than 10 MiB`, { error: true }); return Promise.resolve({ ok: false, status: 413 }); }
      const mime = /^[\w.+-]+\/[\w.+-]+$/.test(file.type) ? file.type : 'application/octet-stream';
      return write('POST', `api/card/${enc(id)}/attachments?name=${enc(file.name)}`, null, { raw: file, headers: { 'Content-Type': mime } });
    },
    detach: (id, attId) => write('DELETE', `api/card/${enc(id)}/attachments/${enc(attId)}`, () => ({})),
    attachmentUrl: (id, attId) => `api/card/${enc(id)}/attachments/${enc(attId)}`,
  };

  // ── Live sync ──────────────────────────────────────────────────────
  let refreshing = null, refreshAgain = false, unregistered = false;
  async function refresh() {
    if (!BOARD || unregistered) return;
    if (refreshing) { refreshAgain = true; return refreshing; }
    refreshing = (async () => {
      try {
        const doc = await request('GET', 'board.json');
        if (!S.doc || doc.rev !== S.rev || S.missing) setDoc(doc, { source: 'remote' });
      } catch (err) {
        if (err.status === 410 || isUnregistered(err)) enterMissing(isUnregistered(err)); else setLive('down');
      } finally {
        refreshing = null;
        if (refreshAgain) { refreshAgain = false; refresh(); }
      }
    })();
    return refreshing;
  }
  WB.refresh = refresh;
  let events = null;
  function connect() {
    events?.close();
    if (unregistered) return;
    events = new EventSource('events');
    events.onopen = () => { setLive('live'); refresh(); };
    events.addEventListener('resync-required', () => refresh());
    events.addEventListener('board-missing', () => enterMissing());
    events.onerror = () => setLive('stale');
  }
  function setLive(state) {
    if (S.missing && state !== 'down') state = 'down';
    S.live = state;
    const el = $('#live');
    el.className = `live${state === 'live' ? '' : state === 'stale' || state === 'connecting' ? ' stale' : ' down'}`;
    el.title = state === 'live' ? 'Live — changes appear instantly' : state === 'down' ? 'Board unavailable' : 'Reconnecting…';
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  // ── Card element ───────────────────────────────────────────────────
  function cardSig(card) {
    const st = subtaskStats(card);
    return [card.title, card.num, card.priority, card.column, (card.tags || []).join('\u0001'), card.activeOwner, card.outcome,
      card.reworkReason ? 1 : 0, card.blockedReason, card.unblockWhen, st.done, st.total, (card.comments || []).length,
      (card.attachments || []).length, (card.dependsOn || []).length, depsSatisfied(card) ? 1 : 0, card.cancelReason,
      card.updatedAt, isActiveWork(card) ? 1 : 0].join('\u0002');
  }
  const isActiveWork = card => S.doc && (S.doc.activeWorkId === card.id || Object.values(S.doc.activeWork || {}).includes(card.id));
  function cardBadges(card) {
    const out = [];
    if (card.column === 'done' && card.outcome === 'canceled') out.push(['Canceled', 'var(--gray)']);
    else if (inRework(card)) out.push(['Rework', 'var(--amber)']);
    if (card.column === 'inprogress') {
      const st = subtaskStats(card);
      if (st.total && st.done === st.total) out.push(['Ready to close', 'var(--green)']);
      else if (Date.now() - Date.parse(card.updatedAt) > 86400000) out.push(['Stale', 'var(--amber)']);
    }
    if ((card.column === 'task' || card.column === 'backlog') && (card.dependsOn || []).length && !depsSatisfied(card)) out.push(['Waiting', 'var(--violet)']);
    return out;
  }
  function fillCard(el, card) {
    const st = subtaskStats(card);
    el.dataset.status = card.column;
    el.classList.toggle('is-done', card.column === 'done');
    el.classList.toggle('is-canceled', card.outcome === 'canceled');
    el.classList.toggle('active-work', !!isActiveWork(card));
    el.setAttribute('aria-label', `Open card #${card.num}: ${card.title}`);
    const top = h('div', { class: 'card-top' },
      card.priority ? prio(card.priority) : null,
      card.column === 'done' && card.outcome === 'completed' ? icon('done', 'sm') : null,
      h('span', { class: 'ref', text: `#${card.num}` }),
      cardBadges(card).map(([label, tone]) => h('span', { class: 'badge', style: { '--tone': tone }, text: label })),
      h('span', { class: 'when', title: `Updated ${fmtDateTime(card.updatedAt)}`, text: relTime(card.updatedAt) }),
      card.activeOwner ? avatar(card.activeOwner) : null);
    if (card.column === 'done' && card.outcome === 'completed') top.querySelector('svg').style.color = 'var(--green)';
    const foot = h('div', { class: 'card-foot' });
    const tags = card.tags || [];
    for (const t of tags.slice(0, 3)) foot.append(h('span', { class: 'chip', text: t }));
    if (tags.length > 3) foot.append(h('span', { class: 'chip', text: `+${tags.length - 3}`, title: tags.slice(3).join(', ') }));
    if (st.total) foot.append(h('span', { class: 'meta', title: `${st.done} of ${st.total} subtasks done` }, progress(st.done, st.total), `${st.done}/${st.total}`));
    if ((card.comments || []).length) foot.append(h('span', { class: 'meta', title: 'Comments' }, icon('comment'), card.comments.length));
    if ((card.attachments || []).length) foot.append(h('span', { class: 'meta', title: 'Files' }, icon('clip'), card.attachments.length));
    if ((card.dependsOn || []).length) foot.append(h('span', { class: 'meta', title: depsSatisfied(card) ? 'Prerequisites complete' : 'Waiting on prerequisites' }, icon('link'), card.dependsOn.length));
    const parts = [top, h('div', { class: 'card-title', text: card.title || 'Untitled' }), foot];
    if (card.column === 'blocked' && (card.blockedReason || card.unblockWhen)) {
      parts.push(h('div', { class: 'card-note', title: `Blocked by: ${card.blockedReason || '—'}\nUnblocks when: ${card.unblockWhen || '—'}` }, h('span', { text: `${card.blockedReason || 'Blocked'}${card.unblockWhen ? ` · until ${card.unblockWhen}` : ''}` })));
    }
    el.replaceChildren(...parts);
  }
  function cardElement(card, board = true) {
    const el = h('article', { class: 'card', tabIndex: 0, attrs: { role: 'button' }, dataset: { id: card.id } });
    if (board) el.draggable = true;
    else {
      el.addEventListener('click', () => WB.openCard(card.id));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); WB.openCard(card.id); } });
    }
    fillCard(el, card);
    if (card.id === S.selectedId) el.classList.add('selected');
    return el;
  }

  // ── Board rendering (keyed, incremental) ───────────────────────────
  const board = $('#board');
  const lanes = new Map();      // colId -> {stack?, lane, body, count, name, empty, more, composer}
  const cardEls = new Map();    // cardId -> {el, sig}
  let layoutSig = '';
  const groupCollapsed = new Set();
  const laneLimit = new Map();  // colId -> visible cap

  function buildLanes() {
    const cols = WB.columns();
    const roots = cols.filter(c => !c.stackUnder || !cols.some(p => p.id === c.stackUnder));
    const nodes = [];
    for (const root of roots) {
      const stack = h('div', { class: 'stack', dataset: { root: root.id } });
      for (const col of [root, ...cols.filter(c => c.stackUnder === root.id)]) {
        let lane = lanes.get(col.id);
        if (!lane) lane = createLane(col);
        lane.name.textContent = col.name;
        stack.append(lane.lane);
      }
      nodes.push(stack);
    }
    board.replaceChildren(...nodes);
  }
  function createLane(col) {
    const name = h('span', { class: 'name' });
    const count = h('span', { class: 'count num' });
    const grip = h('button', { class: 'btn icon xs grip', draggable: true, title: 'Drag to reorder · drop on the lower part of another column to stack', attrs: { 'aria-label': 'Move column' }, dataset: { laneGrip: col.id } }, icon('grip', 'sm'));
    const add = h('button', { class: 'btn icon xs', title: 'Add card', attrs: { 'aria-label': 'Add card' }, dataset: { laneAdd: col.id } }, icon('plus', 'sm'));
    const body = h('div', { class: 'lane-body', dataset: { col: col.id } });
    const lane = h('section', { class: 'lane', dataset: { col: col.id, status: col.id }, attrs: { 'aria-label': col.name } },
      h('header', { class: 'lane-head' }, h('span', { class: col.id === 'task' || col.id === 'backlog' ? 'ring' : 'dot', dataset: { status: col.id } }), name, count,
        h('span', { class: 'tools' }, CORE.slice(0, 3).includes(col.id) ? add : null, grip)),
      body);
    const entry = { lane, body, name, count, empty: h('div', { class: 'lane-empty', text: 'No cards' }), more: null, composer: null };
    lanes.set(col.id, entry);
    return entry;
  }

  function doneGroupLabel(iso) {
    if (!iso) return 'Earlier';
    const d = new Date(iso), today = new Date();
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - day) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return `${diff} days ago`;
    return fmtDate(iso);
  }
  const groupHeads = new Map(); // key -> element

  let renderQueued = false, pendingMeta = null;
  function scheduleRender(meta) {
    pendingMeta = meta?.source === 'remote' || pendingMeta?.source === 'remote' ? { source: 'remote' } : meta;
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; const m = pendingMeta; pendingMeta = null; renderAll(m); });
  }
  function renderAll(meta) {
    if (!S.doc) return;
    renderChrome();
    if (S.view === 'board') renderBoard(meta); else WB.views?.update(S.view, viewInner);
    if (S.selectedId && WB.panel) WB.panel.update();
  }

  function renderBoard(meta = {}) {
    const cols = WB.columns();
    const sig = JSON.stringify(cols.map(c => [c.id, c.name, c.stackUnder || null]));
    if (sig !== layoutSig) { buildLanes(); layoutSig = sig; }
    const animate = meta.source === 'remote' && !reduceMotion.matches;
    const before = animate ? captureRects() : null;
    const groups = new Map(cols.map(c => [c.id, []]));
    const seen = new Set();
    for (const card of WB.cards()) {
      seen.add(card.id);
      if (WB.matches(card)) groups.get(card.column)?.push(card);
    }
    const changed = [];
    for (const col of cols) {
      const lane = lanes.get(col.id);
      const list = groups.get(col.id) || [];
      const total = WB.cards().filter(c => c.column === col.id).length;
      lane.count.textContent = list.length === total ? String(total) : `${list.length}/${total}`;
      const wip = col.wipLimit;
      lane.count.classList.toggle('over', !!wip && total > wip);
      if (wip) lane.count.textContent += ` / ${wip}`;
      reconcile(lane.body, laneNodes(col, list, changed, meta));
    }
    for (const [id, entry] of cardEls) if (!seen.has(id)) { cardEls.delete(id); entry.el.remove(); }
    if (before) playFlip(before, changed);
  }
  function laneNodes(col, list, changed, meta) {
    const lane = lanes.get(col.id);
    const nodes = [];
    const cap = laneLimit.get(col.id) || (col.id === 'done' ? 40 : 150);
    let items = list;
    if (col.id === 'done') items = [...list].sort((a, b) => String(b.doneAt || b.updatedAt).localeCompare(String(a.doneAt || a.updatedAt)));
    const shown = items.slice(0, cap);
    if (col.id === 'done') {
      let current = null, groupIndex = -1;
      const counts = new Map();
      for (const c of shown) { const k = doneGroupLabel(c.doneAt); counts.set(k, (counts.get(k) || 0) + 1); }
      for (const c of shown) {
        const key = doneGroupLabel(c.doneAt);
        if (key !== current) {
          current = key; groupIndex++;
          let head = groupHeads.get(key);
          if (!head) {
            head = h('button', { class: 'group-head', type: 'button', dataset: { group: key } }, icon('down', 'sm'), h('span', { text: key }), h('span', { class: 'count' }));
            groupHeads.set(key, head);
          }
          head.setAttribute('aria-expanded', String(!groupCollapsed.has(key)));
          head.lastChild.textContent = counts.get(key);
          nodes.push(head);
        }
        if (!groupCollapsed.has(key)) nodes.push(cardNode(c, changed, meta));
      }
    } else {
      for (const c of shown) nodes.push(cardNode(c, changed, meta));
    }
    if (items.length > shown.length) {
      lane.more = lane.more || h('button', { class: 'btn more-btn', type: 'button', dataset: { laneMore: col.id } });
      lane.more.textContent = `Show ${Math.min(60, items.length - shown.length)} more`;
      nodes.push(lane.more);
    }
    if (!list.length) nodes.push(lane.empty);
    if (lane.composer) nodes.push(lane.composer);
    return nodes;
  }
  function cardNode(card, changed, meta) {
    const sig = cardSig(card);
    let entry = cardEls.get(card.id);
    if (!entry) {
      entry = { el: cardElement(card), sig };
      cardEls.set(card.id, entry);
      if (meta.source === 'remote' && layoutSig) entry.el.classList.add('enter');
      changed.push(entry.el);
    } else if (entry.sig !== sig) {
      fillCard(entry.el, card);
      entry.sig = sig;
      if (meta.source === 'remote') { entry.el.classList.remove('flash'); void entry.el.offsetWidth; entry.el.classList.add('flash'); }
    }
    return entry.el;
  }
  function reconcile(parent, nodes) {
    let cursor = parent.firstChild;
    for (const node of nodes) {
      if (node === cursor) { cursor = cursor.nextSibling; continue; }
      parent.insertBefore(node, cursor);
    }
    while (cursor) { const next = cursor.nextSibling; cursor.remove(); cursor = next; }
  }
  function captureRects() {
    const rects = new Map();
    const vh = innerHeight;
    for (const [id, { el }] of cardEls) {
      if (!el.isConnected) continue;
      const r = el.getBoundingClientRect();
      if (r.bottom > -200 && r.top < vh + 200) rects.set(el, r);
    }
    return rects;
  }
  function playFlip(before, changed) {
    let n = 0;
    for (const [el, r] of before) {
      if (!el.isConnected || n > 80) continue;
      const a = el.getBoundingClientRect();
      const dx = r.left - a.left, dy = r.top - a.top;
      if (Math.abs(dx) + Math.abs(dy) < 2) continue;
      n++;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.65,0,.35,1)' });
    }
    for (const el of changed) el.addEventListener('animationend', () => el.classList.remove('enter', 'flash'), { once: true });
  }
  // Optimistic local move with FLIP, before the server confirms.
  function localMove(cardId, colId, beforeId) {
    const entry = cardEls.get(cardId); const lane = lanes.get(colId);
    if (!entry || !lane) return;
    const rects = reduceMotion.matches ? null : captureRects();
    const target = beforeId ? cardEls.get(beforeId)?.el : null;
    lane.body.insertBefore(entry.el, target && target.parentNode === lane.body ? target : lane.composer || lane.empty.parentNode === lane.body && lane.empty || null);
    lane.empty.remove();
    if (rects) playFlip(rects, []);
  }

  // Live relative times.
  setInterval(() => {
    for (const [id, { el }] of cardEls) {
      const card = byId.get(id); const when = el.querySelector('.when');
      if (card && when) { const t = relTime(card.updatedAt); if (when.textContent !== t) when.textContent = t; }
    }
  }, 60000);

  // ── Selection / panel ──────────────────────────────────────────────
  WB.openCard = id => {
    const card = WB.card(id);
    if (!card) return;
    if (S.selectedId && S.selectedId !== card.id) cardEls.get(S.selectedId)?.el.classList.remove('selected');
    S.selectedId = card.id;
    cardEls.get(card.id)?.el.classList.add('selected');
    WB.panel?.open(card.id);
    history.replaceState(null, '', `#${card.num}`);
    emit('select', card.id);
  };
  WB.closeCard = () => {
    if (!S.selectedId) return;
    cardEls.get(S.selectedId)?.el.classList.remove('selected');
    S.selectedId = null;
    WB.panel?.close();
    history.replaceState(null, '', location.pathname + location.search);
    emit('select', null);
  };

  // ── Lifecycle flows (dialogs) ──────────────────────────────────────
  const ref = card => `#${card.num}`;
  async function flow(id, run) { const card = WB.card(id); if (!card) return { ok: false }; return run(card); }
  const A = WB.actions = {
    start: id => flow(id, c => WB.api.lifecycle(c.id, 'start')),
    complete: id => flow(id, async c => {
      const v = await prompt({ title: `Complete ${ref(c)}`, body: c.title, ok: 'Complete', fields: [
        { name: 'summary', label: 'What shipped', multiline: true, required: true, placeholder: 'The change and why it matters' },
        { name: 'verification', label: 'How it was verified', multiline: true, required: true, placeholder: 'Checks, tests, or evidence' }] });
      if (!v) return { ok: false };
      if (c.column !== 'inprogress') { const s = await WB.api.lifecycle(c.id, 'start'); if (!s.ok) return s; }
      const r = await WB.api.lifecycle(c.id, 'submit', v);
      if (r.ok) toast(`Completed ${ref(c)}`);
      return r;
    }),
    block: id => flow(id, async c => {
      const v = await prompt({ title: `Block ${ref(c)}`, body: c.title, ok: 'Block', fields: [
        { name: 'reason', label: 'What is blocking it', required: true, multiline: true },
        { name: 'until', label: 'Unblocks when', required: true, placeholder: 'An observable condition' }] });
      return v ? WB.api.lifecycle(c.id, 'block', v) : { ok: false };
    }),
    resume: id => flow(id, async c => {
      const v = await prompt({ title: `Resume ${ref(c)}`, body: c.blockedReason ? `Blocked by: ${c.blockedReason}` : c.title, ok: 'Resume', fields: [
        { name: 'note', label: 'How it was resolved', required: true, multiline: true },
        { name: 'to', label: 'Continue in', value: 'inprogress', options: [{ value: 'inprogress', label: 'In Progress' }, { value: 'task', label: 'Task' }] }] });
      return v ? WB.api.lifecycle(c.id, 'resume', v) : { ok: false };
    }),
    reasoned: (id, action, title, label, ok, extra = {}) => flow(id, async c => {
      const v = await prompt({ title: `${title} ${ref(c)}`, body: c.title, ok, fields: [{ name: action === 'improve' ? 'text' : 'reason', label, required: true, multiline: true }] });
      return v ? WB.api.lifecycle(c.id, action, { ...v, ...extra }) : { ok: false };
    }),
    cancel: id => A.reasoned(id, 'cancel', 'Cancel', 'Why is it being canceled?', 'Cancel card'),
    rework: id => A.reasoned(id, 'rework', 'Return', 'What needs another pass?', 'Return for rework'),
    bug: id => A.reasoned(id, 'bug', 'Reopen', 'What is broken?', 'Reopen as bug'),
    improve: id => A.reasoned(id, 'improve', 'Improve', 'What should be improved?', 'Reopen'),
    takeover: id => A.reasoned(id, 'takeover', 'Take over', 'Why are you taking over?', 'Take over'),
    reopen: id => flow(id, async c => {
      const v = await prompt({ title: `Reopen ${ref(c)}`, body: c.title, ok: 'Reopen', fields: [
        { name: 'reason', label: 'Why reopen it?', required: true, multiline: true },
        { name: 'to', label: 'Reopen into', value: 'task', options: [{ value: 'task', label: 'Task' }, { value: 'inprogress', label: 'In Progress' }] }] });
      return v ? WB.api.lifecycle(c.id, 'reopen', { reason: v.reason, to: v.to, as: 'task' }) : { ok: false };
    }),
    followUp: id => flow(id, async c => {
      const v = await prompt({ title: `Follow-up to ${ref(c)}`, body: c.title, ok: 'Create', fields: [{ name: 'title', label: 'Title', required: true }] });
      if (!v) return { ok: false };
      const r = await WB.api.structure({ type: 'create-follow-up', sourceCardId: c.id, card: { id: newCardId(v.title), title: v.title, column: 'task' } });
      if (r.ok && r.res.card) WB.openCard(r.res.card.id);
      return r;
    }),
    workpad: id => flow(id, c => WB.api.lifecycle(c.id, 'workpad')),
    del: id => flow(id, async c => {
      const yes = await confirm({ title: `Delete ${ref(c)}?`, body: `“${c.title}” will be removed from the board. It can only be recovered from a board backup.`, ok: 'Delete', danger: true });
      if (!yes) return { ok: false };
      const r = await WB.api.structure({ type: 'delete-card', cardId: c.id });
      if (r.ok) { if (S.selectedId === c.id) WB.closeCard(); toast(`Deleted ${ref(c)}`); }
      return r;
    }),
    copyRef: id => flow(id, async c => {
      const text = `#${c.num} ${c.title}`;
      try { await navigator.clipboard.writeText(text); toast(`Copied ${ref(c)}`); } catch { toast(text); }
      return { ok: true };
    }),
    primaryFor: card => {
      if (!card) return null;
      if (card.column === 'backlog' || card.column === 'task') return { label: 'Start', icon: 'play', run: () => A.start(card.id) };
      if (card.column === 'inprogress') {
        if (card.activeOwner && card.activeOwner !== S.actor) return { label: 'Take over', icon: 'hand', run: () => A.takeover(card.id) };
        return { label: 'Complete', icon: 'check', run: () => A.complete(card.id) };
      }
      if (card.column === 'blocked') return { label: 'Resume', icon: 'play', run: () => A.resume(card.id) };
      if (card.column === 'done') return { label: 'Reopen', icon: 'rework', run: () => A.reopen(card.id) };
      return null;
    },
    menuFor: card => {
      const id = card.id, col = card.column, items = [];
      if (col === 'backlog' || col === 'task') items.push({ label: 'Start', icon: 'play', run: () => A.start(id) });
      if (col === 'inprogress') items.push({ label: 'Complete…', icon: 'check', run: () => A.complete(id) });
      if (col === 'inprogress' && card.activeOwner && card.activeOwner !== S.actor) items.push({ label: 'Take over…', icon: 'hand', run: () => A.takeover(id) });
      if (col === 'blocked') items.push({ label: 'Resume…', icon: 'play', run: () => A.resume(id) });
      if (col !== 'done' && col !== 'blocked') items.push({ label: 'Block…', icon: 'blocked', run: () => A.block(id) });
      if (col === 'done') {
        items.push({ label: 'Reopen…', icon: 'rework', run: () => A.reopen(id) },
          { label: 'Reopen as bug…', icon: 'bug', run: () => A.bug(id) },
          { label: 'Improve…', icon: 'spark', run: () => A.improve(id) },
          { label: 'Create follow-up…', icon: 'plus', run: () => A.followUp(id) });
      } else {
        items.push({ label: 'Return for rework…', icon: 'rework', run: () => A.rework(id) },
          { label: 'Cancel card…', icon: 'canceled', run: () => A.cancel(id) });
      }
      items.push('sep', { label: 'Add acceptance template', icon: 'edit', run: () => A.workpad(id) },
        { label: 'Copy reference', icon: 'copy', hint: `#${card.num}`, run: () => A.copyRef(id) },
        'sep', { label: 'Delete…', icon: 'trash', danger: true, run: () => A.del(id) });
      return items;
    },
    statusMenuFor: card => [{ header: 'Move to' }, ...WB.columns().map(col => ({
      label: col.name, iconNode: statusDot(col.id), checked: col.id === card.column,
      run: () => { if (col.id !== card.column) moveCard(card.id, col.id); },
    }))],
  };

  // Route a status change through the right lifecycle flow.
  async function moveCard(id, to, position) {
    const card = WB.card(id);
    if (!card || (card.column === to && !position)) return { ok: false };
    const from = card.column;
    if (from === to) return reorder(card, position);
    if (to === 'done') return A.complete(id);
    if (to === 'blocked') return A.block(id);
    if (from === 'blocked') {
      if (to === 'backlog') { toast('Resume the card into Task or In Progress first'); return { ok: false }; }
      return flow(id, async c => {
        const v = await prompt({ title: `Resume ${ref(c)}`, body: c.blockedReason ? `Blocked by: ${c.blockedReason}` : c.title, ok: 'Resume', fields: [{ name: 'note', label: 'How it was resolved', required: true, multiline: true }] });
        return v ? WB.api.lifecycle(c.id, 'resume', { note: v.note, to }) : { ok: false };
      });
    }
    if (from === 'done') {
      if (to === 'backlog') { toast('Reopen the card into Task or In Progress first'); return { ok: false }; }
      return flow(id, async c => {
        const v = await prompt({ title: `Reopen ${ref(c)}`, body: c.title, ok: 'Reopen', fields: [{ name: 'reason', label: 'Why reopen it?', required: true, multiline: true }] });
        return v ? WB.api.lifecycle(c.id, 'reopen', { reason: v.reason, to, as: 'task' }) : { ok: false };
      });
    }
    if (to === 'inprogress') {
      localMove(id, to, position?.before);
      const r = await WB.api.lifecycle(id, 'start');
      if (r.ok && position) await WB.api.patchCard(id, {}, { position });
      return r;
    }
    localMove(id, to, position?.before);
    const r = await WB.api.patchCard(id, { column: to }, position ? { position } : undefined);
    if (r.ok) pushUndo(`Moved ${ref(card)} to ${WB.colName(to)}`, () => WB.api.patchCard(id, { column: from }), () => WB.api.patchCard(id, { column: to }));
    return r;
  }
  async function reorder(card, position) {
    const cards = WB.cards().filter(c => c.column === card.column);
    const i = cards.findIndex(c => c.id === card.id);
    const prevPos = cards[i + 1] ? { before: cards[i + 1].id } : cards[i - 1] ? { after: cards[i - 1].id } : null;
    localMove(card.id, card.column, position.before);
    const r = await WB.api.patchCard(card.id, {}, { position });
    if (r.ok && prevPos) pushUndo(`Reordered ${ref(card)}`, () => WB.api.patchCard(card.id, {}, { position: prevPos }), () => WB.api.patchCard(card.id, {}, { position }));
    return r;
  }
  WB.moveCard = moveCard;

  // ── Undo (inverse server writes; never snapshot saves) ─────────────
  const undoStack = [], redoStack = [];
  function pushUndo(label, undo, redo) {
    undoStack.push({ label, undo, redo }); redoStack.length = 0;
    if (undoStack.length > 50) undoStack.shift();

  }
  async function runUndo() {
    const item = undoStack.pop();

  }
  async function runRedo() {
    const item = redoStack.pop();
    if (!item) { toast('Nothing to redo'); return; }
    const r = await item.redo();
    if (r?.ok) { undoStack.push(item); toast(`Redid: ${item.label}`); }
  }
  WB.undo = { push: pushUndo, run: runUndo, redo: runRedo };

  // ── Card creation ──────────────────────────────────────────────────
  function newCardId(title) {
    const slug = String(title).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32).replace(/-+$/, '');
    const hex = crypto.randomUUID().replace(/-/g, '');
    return slug ? `${slug}-${hex}` : hex;
  }
  async function createCard({ title, column = 'task', priority = null, open = false }) {
    const card = { id: newCardId(title), title: title.trim(), column };
    if (priority) card.priority = priority;
    const r = await WB.api.structure({ type: 'create-card', card });
    if (r.ok && open && r.res.card) WB.openCard(r.res.card.id);
    return r;
  }
  WB.createCard = createCard;
  function openComposer(colId) {
    if (S.view !== 'board') WB.setView('board');
    const lane = lanes.get(colId);
    if (!lane) return;
    if (!lane.composer) {
      const input = h('textarea', { class: 'field', rows: 1, placeholder: 'Card title…', attrs: { 'aria-label': `New card in ${WB.colName(colId)}` }, style: { fontWeight: '500' } });
      const box = h('div', { class: 'card', style: { cursor: 'text', padding: '6px' } }, input,
        h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'flex-end', marginTop: '4px' } },
          h('button', { class: 'btn xs', type: 'button', text: 'Cancel', on: { click: () => closeComposer(colId) } }),
          h('button', { class: 'btn xs primary', type: 'button', text: 'Add', on: { click: () => submit() } })));
      const submit = async () => {
        const title = input.value.trim();
        if (!title) return;
        input.value = '';
        const r = await createCard({ title, column: colId });
        if (!r.ok) input.value = title;
        input.focus();
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeComposer(colId); }
      });
      lane.composer = box;
    }
    lane.body.append(lane.composer);
    lane.composer.classList.add('enter');
    lane.composer.querySelector('textarea').focus();
    lane.composer.scrollIntoView({ block: 'nearest', behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  }
  function closeComposer(colId) {
    const lane = lanes.get(colId);

  }
  async function newCardDialog() {

    });

  WB.setPriority = setPriority;

  // Board pan: drag empty board space to scroll horizontally.
  board.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !(e.target === board || e.target.classList.contains('stack'))) return;
    const x0 = e.clientX, s0 = board.scrollLeft;
    board.setPointerCapture(e.pointerId); board.style.cursor = 'grabbing';
    const move = ev => { board.scrollLeft = s0 - (ev.clientX - x0); };

  // ── Drag and drop: cards ───────────────────────────────────────────
  let drag = null; // {kind:'card'|'lane', id}
  const dropLine = h('div', { style: { height: '2px', margin: '-4px 6px 2px', borderRadius: '2px', background: 'var(--accent)', pointerEvents: 'none' } });
  let trash = null;
  board.addEventListener('dragstart', e => {
    const grip = e.target.closest?.('[data-lane-grip]');
    if (grip) {
      drag = { kind: 'lane', id: grip.dataset.laneGrip };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', `lane:${drag.id}`);
      const lane = lanes.get(drag.id).lane;
      e.dataTransfer.setDragImage(lane, 24, 20);
      requestAnimationFrame(() => lane.classList.add('dragging'));
      return;
    }
    const el = e.target.closest?.('.card[data-id]');
    if (!el) return;
    drag = { kind: 'card', id: el.dataset.id };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', `#${WB.card(drag.id)?.num}`);
    requestAnimationFrame(() => el.classList.add('dragging'));
    trash = h('div', { class: 'trash' }, icon('trash'), 'Drop here to delete');
    trash.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; trash.classList.add('over'); clearDropMarks(); });
    trash.addEventListener('dragleave', () => trash.classList.remove('over'));
    trash.addEventListener('drop', ev => { ev.preventDefault(); const id = drag?.id; endDrag(); if (id) A.del(id); });
    document.body.append(trash);
  });
  function clearDropMarks() {
    dropLine.remove();
    for (const { lane } of lanes.values()) lane.classList.remove('drop', 'stack-target');
    for (const s of board.querySelectorAll('.insert-before, .insert-after')) s.classList.remove('insert-before', 'insert-after');
  }
  function endDrag() {
    if (drag?.kind === 'card') cardEls.get(drag.id)?.el.classList.remove('dragging');
    if (drag?.kind === 'lane') lanes.get(drag.id)?.lane.classList.remove('dragging');
    drag = null; clearDropMarks(); trash?.remove(); trash = null;
  }
  board.addEventListener('dragend', endDrag);
  let lastOver = 0;
  board.addEventListener('dragover', e => {
    if (!drag) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const now = performance.now();
    if (now - lastOver < 16) return;
    lastOver = now;
    if (drag.kind === 'card') cardOver(e); else laneOver(e);
  });
  function cardDropTarget(e) {
    const laneEl = e.target.closest?.('.lane');
    if (!laneEl) return null;
    const col = laneEl.dataset.col;
    const body = lanes.get(col).body;
    const cards = [...body.querySelectorAll(':scope > .card[data-id]')].filter(c => c.dataset.id !== drag.id);
    let before = null;
    for (const c of cards) { const r = c.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = c; break; } }
    return { col, body, before };
  }
  function cardOver(e) {
    const t = cardDropTarget(e);
    clearDropMarks();
    if (!t) return;
    lanes.get(t.col).lane.classList.add('drop');
    if (t.col !== 'done') t.body.insertBefore(dropLine, t.before || lanes.get(t.col).composer || null);
  }
  board.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const d = drag;
    if (d.kind === 'card') {
      const t = cardDropTarget(e);
      endDrag();
      if (!t) return;
      const card = WB.card(d.id);
      if (!card) return;
      let position;
      if (t.col !== 'done') {
        if (t.before) position = { before: t.before.dataset.id };
        else { const inCol = WB.cards().filter(c => c.column === t.col && c.id !== d.id); if (inCol.length) position = { after: inCol[inCol.length - 1].id }; }
      }
      if (card.column === t.col) {
        if (!position) return;
        const cards = WB.cards().filter(c => c.column === t.col);
        const i = cards.findIndex(c => c.id === d.id);
        if ((position.before && cards[i + 1]?.id === position.before) || (position.after && cards[i - 1]?.id === position.after) || (position.after && i === cards.length - 1)) return;
      }
      moveCard(d.id, t.col, position);
    } else {
      const target = laneTarget(e);
      endDrag();
      if (target) moveLane(d.id, target);
    }
  });

  // ── Drag and drop: columns (reorder + bottom-zone stacking) ────────
  function laneTarget(e) {
    const laneEl = e.target.closest?.('.lane');
    const stackEl = e.target.closest?.('.stack');
    if (!stackEl) return null;
    if (laneEl && laneEl.dataset.col !== drag.id) {
      const r = laneEl.getBoundingClientRect();
      if (e.clientY > r.bottom - Math.min(80, r.height * 0.4)) return { stackUnder: laneEl.dataset.col, lane: laneEl };
    }
    const r = stackEl.getBoundingClientRect();
    return { root: stackEl.dataset.root, side: e.clientX < r.left + r.width / 2 ? 'before' : 'after', stack: stackEl };
  }
  function laneOver(e) {
    clearDropMarks();
    const t = laneTarget(e);
    if (!t) return;
    if (t.stackUnder) t.lane.classList.add('stack-target');
    else t.stack.classList.add(t.side === 'before' ? 'insert-before' : 'insert-after');
  }
  async function moveLane(id, target) {
    const cols = WB.columns().map(c => ({ ...c }));
    const before = WB.columns().map(c => ({ ...c }));
    const src = cols.find(c => c.id === id);
    const rootOf = c => (c.stackUnder && cols.some(p => p.id === c.stackUnder) ? c.stackUnder : c.id);
    let moving = [src];
    if (!src.stackUnder) moving = [src, ...cols.filter(c => c.stackUnder === src.id)];
    let rest = cols.filter(c => !moving.includes(c));
    if (target.stackUnder) {
      const tgt = cols.find(c => c.id === target.stackUnder);
      const root = rootOf(tgt);
      if (root === id) return;
      src.stackUnder = root;
      for (const child of moving.slice(1)) child.stackUnder = root;
      const lastInStack = rest.reduce((idx, c, i) => (c.id === root || c.stackUnder === root ? i : idx), -1);
      rest.splice(lastInStack + 1, 0, ...moving);
    } else {
      if (target.root === id) return;
      src.stackUnder = null;
      const members = rest.filter(c => c.id === target.root || c.stackUnder === target.root);
      const first = rest.indexOf(members[0]), last = rest.indexOf(members[members.length - 1]);
      rest.splice(target.side === 'before' ? first : last + 1, 0, ...moving);
    }
    const payload = rest.map(c => ({ id: c.id, name: c.name, kind: c.kind, stackUnder: c.stackUnder || null, ...(c.wipLimit != null ? { wipLimit: c.wipLimit } : {}) }));
    if (JSON.stringify(payload.map(c => [c.id, c.stackUnder])) === JSON.stringify(before.map(c => [c.id, c.stackUnder || null]))) return;
    const toPayload = list => list.map(c => ({ id: c.id, name: c.name, kind: c.kind, stackUnder: c.stackUnder || null, ...(c.wipLimit != null ? { wipLimit: c.wipLimit } : {}) }));
    const r = await WB.api.structure({ type: 'update-columns', columns: payload });
    if (r.ok) pushUndo(target.stackUnder ? `Stacked ${WB.colName(id)} under ${WB.colName(target.stackUnder)}` : `Moved ${WB.colName(id)}`,
      () => WB.api.structure({ type: 'update-columns', columns: toPayload(before) }),
      () => WB.api.structure({ type: 'update-columns', columns: payload }));
  }
  async function resetColumns() {
    const byIdCol = new Map(WB.columns().map(c => [c.id, c]));
    const before = WB.columns().map(c => ({ id: c.id, name: c.name, kind: c.kind, stackUnder: c.stackUnder || null, ...(c.wipLimit != null ? { wipLimit: c.wipLimit } : {}) }));
    const cols = CORE.map(id => { const c = byIdCol.get(id); return { id, name: c.name, kind: c.kind, stackUnder: null, ...(c.wipLimit != null ? { wipLimit: c.wipLimit } : {}) }; });
    const r = await WB.api.structure({ type: 'update-columns', columns: cols });

  async function setWip() {

        cards = [...WB.cards()].filter(c => c.column !== 'done').sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 8);
      }

      if (q) groups.push(['Board', [{ label: `Filter board by “${q}”`, icon: 'filter', run: () => { S.search = q; WB.setView('board'); applyFilters(); } }]]);

  WB.openPalette = openPalette;
  $('#search-open').addEventListener('click', () => openPalette());

  // ── Keyboard ───────────────────────────────────────────────────────
  const typing = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  document.addEventListener('keydown', e => {
    if (!S.doc && e.key !== 'Escape') return;

    }
    connect();
  };
})();

  // mdParse is pure (text -> block AST, no DOM). mdBlocks builds elements with h() and text nodes

      return m && { ind: indent(m[1]), ordered: /\d/.test(m[2]), start: /\d/.test(m[2]) ? parseInt(m[2], 10) : 1, text: m[3] || '' };

      const it = item(line);

    function inline(s, d = 0, inLink = false) {

      const emit = node => { if (buf) out.push({ type: 'text', text: buf }); buf = ''; if (node) out.push(node); };

      // hit (or miss) stays valid and pathological input stays linear.

    }

    // One nesting level: deeper items flatten into the nested list; indented or lazy lines continue an item.
    function list(i) {
      const first = item(lines[i]), base = first.ind;
      const node = { type: 'list', ordered: first.ordered, start: first.start, items: [] };
      let top = null, sub = null, gap = false;

        while (++i < lines.length) {

        while (i < lines.length && (m = QUOTE.exec(lines[i]))) { inner.push(m[1]); i++; }
        blocks.push({ type: 'quote', blocks: mdParse(inner.join('\n'), 1) });

      else {
        const para = [line.trim()];
        while (++i < lines.length && lines[i].trim() && !starts(lines[i])) para.push(lines[i].trim());

  }

    : n.type === 'br' ? h('br')
    : n.type === 'code' ? h('code', { text: n.text })
    : n.type === 'link' ? h('a', { href: n.href, target: '_blank', rel: 'noopener noreferrer' }, mdInline(n.children))
    : h(n.type === 'strong' ? 'strong' : 'em', {}, mdInline(n.children))));

    : b.type === 'list' ? h(b.ordered ? 'ol' : 'ul', { start: b.ordered && b.start !== 1 ? b.start : null },
      b.items.map(it => h('li', {}, mdInline(it.inline), it.list && mdBlocks([it.list]))))

  // ── Slots ───────────────────────────────────────────────────────────
  // Each independently rendered part is a slot that re-renders only when its signature changes.
  // A busy slot (focus or unsaved text inside) is skipped and retried on the next flush/update.
  const slot = (sig, fill, opts) => { cur.slots.push({ sig, fill, last: undefined, ...opts }); };
  function render(card, crossOnly = false) {
    for (const s of cur.slots) {
      if (crossOnly && !s.cross) continue;
      const k = s.sig(card);
      if (k === s.last || s.busy?.()) continue;
      s.last = k;
      s.fill(card);
    }
  }
  function flush() {
    const card = cur && !cur.gone && WB.card(cur.id);
    if (card) render(card);
  }

  // ── Writes ──────────────────────────────────────────────────────────
  // Read-modify-write edits (tags, links, dependencies, subtasks) run one at a time against the
  // latest card, so quick successive edits never overwrite each other.
  let chain = Promise.resolve();
  function edit(id, build) {
    const p = chain.then(() => { const c = WB.card(id); return c ? build(c) || { ok: true } : { ok: false }; });
    chain = p.catch(() => {});
    return p;
  }
  const editTree = (id, change) => edit(id, c => {
    const tree = structuredClone(c.subtasks || []);
    return change(tree) === false ? null : api.patchCard(id, { subtasks: tree });
  });
  const setRefs = (id, key, change) => edit(id, c => {
    const next = change(c[key] || []);
    if (!next) return null;
    return key === 'dependsOn' ? api.lifecycle(id, 'dependencies', { ids: next }) : api.patchCard(id, { links: next });
  });
  function addRef(id, key, raw) {
    const d = WB.card(raw);
    if (!d || d.id === id) { ui.toast(d ? 'A card cannot point at itself' : `No card matches “${raw}”`, { error: true }); return { ok: false }; }
    return setRefs(id, key, list => (list.includes(d.id) ? null : [...list, d.id]));
  }

  // Text saves on blur (and on Enter when `enter`) only when it differs from the card; a failed save
  // keeps the draft and marks the control. Core's Esc blurs, which saves too.
  function bindText(el, save, { enter = false, required = false } = {}) {
    el.addEventListener('blur', async () => {
      if (required && !el.value.trim()) el.value = bases.get(el) ?? '';

  }

  // ── Subtask tree ────────────────────────────────────────────────────
  function locate(list, sid) {
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === sid) return { node: list[i], list, i };

    return null;
  }
  const nodeOf = (tree, sid) => locate(tree, sid)?.node;

      if (visible) n.shown++;
      countTree(s.children, visible && !s.collapsed, n);
    }
    return n;
  }

  // ── Activity wording ────────────────────────────────────────────────
  const EVENTS = {
    created: 'created the card',
    'follow-up': e => `created follow-up ${String(e.note || '').replace(/^Created /, '')}`.trim(),
    start: 'started work',
    move: e => `moved it to ${WB.colName(e.to)}`,
    complete: 'completed it',
    blocked: 'blocked it',
    unblocked: e => `resumed it in ${WB.colName(e.to)}`,
    cancel: 'canceled it',
    rework: 'returned it for rework',
    reopened: 'reopened it',
    bug: 'reopened it as a bug',
    improve: 'reopened it to improve',
    takeover: 'took over',
    dependencies: e => (!e.note || e.note === 'cleared' ? 'cleared its dependencies'
      : `set dependencies to ${e.note.split(', ').map(r => { const d = WB.card(r); return d ? `#${d.num}` : r; }).join(', ')}`),
    workpad: 'added the acceptance template',
    'comment-add': 'commented',
    'comment-edit': 'edited a comment',
    'comment-delete': 'deleted a comment',
    'attachment-added': e => `attached ${e.note || 'a file'}`,
    'attachment-removed': e => `removed ${e.note || 'a file'}`,
    'column-consolidated': e => `moved it to ${WB.colName(e.to)}`,
    'subtask-add': 'added subtasks',
    'subtask-done': 'checked off subtasks',
    'subtask-undone': 'reopened subtasks',
    'subtask-rm': 'removed subtasks',
    note: 'added a note',
  };

  const REASONED = new Set(['start', 'move', 'blocked', 'unblocked', 'cancel', 'rework', 'reopened', 'bug', 'improve', 'takeover']);
  function describe(e) {
    // Legacy entries carry only from/to: a null origin is creation, anything else a move.
    const ev = e.ev || (e.to ? (e.from == null ? 'created' : 'move') : null);
    const d = EVENTS[ev];
    const what = typeof d === 'function' ? d(e) : d || ev || 'updated it';
    const who = e.by || (e.via === 'agent' ? 'An agent' : 'Someone');
    return `${who} ${what}${e.note && (REASONED.has(ev) || !d) ? ` — ${e.note}` : ''}`;
  }

  // ── Skeleton (built once) ───────────────────────────────────────────
  function statusButton() {

      on: { click: () => { const c = cur && WB.card(cur.id); if (c) ui.menu(btn, A.statusMenuFor(c)); } } });
    return btn;
  }
  function fillStatus(btn, c) {
    const name = WB.colName(c.column);
    put(btn, ui.statusDot(c.column), name, icon('down', 'sm'));
    btn.setAttribute('aria-label', `Status: ${name}`);
  }
  function skeleton() {
    panel = document.getElementById('panel');
    panel.tabIndex = -1;
    barStatus = statusButton();
    refBtn = h('button', { class: 'btn xs ref', type: 'button', title: 'Copy reference', on: { click: () => cur && A.copyRef(cur.id) } });
    primaryBtn = h('button', { class: 'btn sm primary pill', type: 'button', hidden: true, on: { click: () => primaryRun?.() } });
    const more = iconBtn('more', 'More actions', () => { const c = cur && WB.card(cur.id); if (c) ui.menu(more, A.menuFor(c), { align: 'end' }); }, 'btn icon sm', '');
    expandBtn = iconBtn('expand', 'Wide view', toggleWide, 'btn icon sm', '');

    sendBtn = h('button', { class: 'btn icon send', type: 'button', disabled: true, title: 'Send', attrs: { 'aria-label': 'Send comment' }, on: { click: send } }, icon('up'));
    who = h('span', { class: 'who' });

    panel.append(
      h('div', { class: 'panel-bar' }, barStatus, refBtn, h('span', { class: 'spacer' }), primaryBtn, more, expandBtn,
        iconBtn('x', 'Close', () => WB.closeCard(), 'btn icon sm', '')),
      body,
      h('div', { class: 'panel-foot' }, h('div', { class: 'composer' }, composer,
        h('div', { class: 'composer-bar' }, iconBtn('clip', 'Attach files', () => fileInput.click(), 'btn icon sm', ''), who, sendBtn))),
      fileInput);
    setActor(WB.state.actor);

  // ── Body ────────────────────────────────────────────────────────────
  function build(card) {

    const title = field(h('textarea', { class: 'panel-title', rows: 1, placeholder: 'Untitled', attrs: { 'aria-label': 'Title' } }),

      textSection(id, 'Description', 'origin', 'Add a description…'),

        run: () => { if ((c.priority || null) !== p) api.patchCard(id, { priority: p }); } })));
    } } });

        c.claimedAt ? h('span', { class: 'faint', title: ui.fmtDateTime(c.claimedAt), text: `since ${ui.relTime(c.claimedAt)}` }) : null]
      : h('span', { class: 'faint', text: 'Unowned' })));

      slot(c => json((c[key] || []).map(sig)),
        c => put(list, (c[key] || []).map(r => pill(r, key === 'dependsOn', () => setRefs(id, key, l => l.filter(x => x !== r))))), { cross: true });
