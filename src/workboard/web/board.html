      if (done) mark.style.color = 'var(--green)';
      put(outcome, mark, h('span', { text: done ? 'Completed' : 'Canceled' }),
        done ? (c.doneAt ? h('span', { class: 'faint' }, when(c.doneAt)) : null) : (c.cancelReason ? h('span', { class: 'faint', text: c.cancelReason }) : null));
    });

    const created = h('div', { class: 'prop-value faint' }), updated = h('div', { class: 'prop-value faint' });
    slot(c => json([c.createdAt, c.updatedAt]), c => { put(created, when(c.createdAt)); put(updated, when(c.updatedAt)); });

    return h('div', { class: 'props' },
      label('Status'), value(status),
      label('Priority'), value(prio),
      label('Owner'), owner,
      label('Tags'), value(tags, tagInput),
      label('Depends on'), value(refs('dependsOn', 'Add dependency')),
      label('Links'), value(refs('links', 'Add link')),
      label('Code'), value(code),
      blockedLabel, blocked,
      outcomeLabel, outcome,
      label('Created'), created,
      label('Updated'), updated);
  }
  function pill(ref, showDone, onRemove) {
    const d = WB.card(ref);
    const ok = showDone && !!d && d.column === 'done' && d.outcome === 'completed';
    const name = d ? `#${d.num}` : ref;
    return h('span', { class: ok ? 'dep ok' : 'dep', title: d ? `${name} ${d.title} · ${ok ? 'complete' : WB.colName(d.column)}` : 'Card not found' },
      h('span', { class: 'ref mono', text: d ? name : '?' }),
      h('span', { class: 't', text: d ? d.title : ref }),
      ok ? icon('check', 'sm') : null,
      iconBtn('x', `Remove ${name}`, onRemove));
  }

  function textSection(id, title, key, placeholder) {
    const el = field(h('textarea', { class: 'field', rows: 1, placeholder, attrs: { 'aria-label': title } }),
      c => c[key] || '', v => api.patchCard(id, { [key]: v }));
    return section(title, null, null, el);
  }

  // ── Notes: pinned markdown + a timeline of log entries ──────────────
  const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  // Date-only legacy stamps are local calendar days; timed entries are instants shown in local time.
  function stamp(at) {
    const ymd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(at);
    const t = ymd ? new Date(+ymd[1], ymd[2] - 1, +ymd[3]) : new Date(at);
    if (Number.isNaN(+t)) return { key: '', day: 'Undated', title: String(at ?? ''), time: '' };
    const now = new Date();
    const ago = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
    return {
      key: dayKey(t),
      day: ago === 0 ? 'Today' : ago === 1 ? 'Yesterday' : ui.fmtDate(t),
      title: ymd ? ui.fmtDate(t) : ui.fmtDateTime(t),
      time: ymd ? '' : `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`,
    };
  }

  function notes(id) {
    let st = noteUi.get(id);
    if (!st) noteUi.set(id, st = { open: new Set(), newest: null, all: false, draft: null });
    const count = counter();

    // Pinned notes: rendered markdown; Edit swaps in the autosaving textarea until blur (Esc blurs too).
    const pinView = h('div', { class: 'md' });
    const pinEdit = field(h('textarea', { class: 'field', rows: 1, attrs: { 'aria-label': 'Pinned notes' } }),
      c => c.notes || '', v => api.patchCard(id, { notes: v }));
    const pin = h('div', { class: 'pinned', hidden: true }, pinView, pinEdit,
      iconBtn('edit', 'Edit pinned notes', () => { pin.classList.add('editing'); pinEdit.focus(); }, 'btn icon xs pin-edit'));
    const paintPin = text => { pin.hidden = !text.trim(); put(pinView, mdBlocks(mdParse(text))); };
    slot(c => c.notes || '', c => paintPin(c.notes || ''), { busy: () => pin.classList.contains('editing') || isDirty(pinEdit) });
    // Shows the text being saved at once; a failed save stays dirty, so the slot keeps showing the draft.
    pinEdit.addEventListener('blur', () => { pin.classList.remove('editing'); paintPin(pinEdit.value); });

    // Timeline: newest first, grouped by day. Rows are keyed by entry id and reused, so live updates only
    // insert or drop rows and never reset expansion, focus or scroll. Bodies render on first expand.
    const list = h('div', { class: 'timeline' });
    const rows = new Map(), heads = new Map();   // entry id -> row, day key -> day label element
    let expandable = [];                         // rows on show that have a body
    const more = moreBtn(() => { st.all = true; flush(); });
    const allBtn = h('button', { class: 'btn xs', type: 'button', hidden: true, on: { click: () => {
      const on = expandable.some(r => !st.open.has(r.id));
      for (const r of expandable) setOpen(r, on);
      syncAll();
    } } });
    const syncAll = () => {
      allBtn.hidden = expandable.length < 2;
      allBtn.textContent = expandable.some(r => !st.open.has(r.id)) ? 'Expand all' : 'Collapse all';
    };
    function setOpen(r, on) {
      if (on) st.open.add(r.id); else st.open.delete(r.id);
      r.btn.setAttribute('aria-expanded', String(on));
      r.el.classList.toggle('open', on);
      if (on && !r.body) r.el.append(r.body = h('div', { class: 'md tl-body' }, r.plain ? plainBlocks(r.text) : mdBlocks(mdParse(r.text))));
      if (r.body) r.body.hidden = !on;
    }
    const plainBlocks = text => text.split(/\n{2,}/).map(p => h('p', {}, p.split('\n').flatMap((line, i) =>
      i ? [h('br'), document.createTextNode(line)] : [document.createTextNode(line)])));
    function row(e, t) {
      const parts = [h('span', { class: 'tl-dot' }), h('span', { class: 'tl-chev' }, e.body ? icon('right', 'sm') : null),
        h('span', { class: 'tl-sum', text: e.summary }),
        h('span', { class: 'tl-meta' }, e.by ? [ui.avatar(e.by), h('span', { class: 'tl-by', text: e.by })] : null,
          t.time ? h('time', { dateTime: e.at, text: t.time }) : null)];
      if (!e.body) return { el: h('div', { class: 'tl-item' }, h('div', { class: 'tl-row static', title: t.title }, parts)) };
      // Date-only entries were migrated from pre-timeline plain-text notes: never reinterpret them as markdown.
      const r = { id: e.id, text: e.body, body: null, plain: /^\d{4}-\d{2}-\d{2}$/.test(e.at) };
      r.btn = h('button', { class: 'tl-row', type: 'button', title: t.title, attrs: { 'aria-expanded': 'false' },
        on: { click: () => { setOpen(r, !st.open.has(r.id)); syncAll(); } } }, parts);
      r.el = h('div', { class: 'tl-item' }, r.btn);
      return r;
    }
    slot(c => json((c.log || []).map(e => e.id)) + st.all + dayKey(new Date()), c => {
      const log = c.log || [];
      const last = log[log.length - 1];
      if (last && last.id !== st.newest) { st.newest = last.id; if (last.body) st.open.add(last.id); }
      const nodes = [], seen = new Set(), used = new Set();
      let day = null;
      expandable = [];
      for (const e of (st.all ? log.slice() : log.slice(-LOG_CAP)).reverse()) {
        const t = stamp(e.at);
        if (t.key !== day) {
          day = t.key;
          let head = heads.get(day);
          if (!head || used.has(head)) { head = h('div', { class: 'tl-day' }); if (!heads.has(day)) heads.set(day, head); }
          used.add(head);
          if (head.textContent !== t.day) head.textContent = t.day;
          nodes.push(head);
        }
        let r = rows.get(e.id);
        if (!r) rows.set(e.id, r = row(e, t));
        if (r.btn) { setOpen(r, st.open.has(r.id)); expandable.push(r); }
        seen.add(e.id);
        nodes.push(r.el);
      }
      for (const k of rows.keys()) if (!seen.has(k)) rows.delete(k);
      for (const [k, el] of heads) if (!used.has(el)) heads.delete(k);
      ui.reconcile(list, nodes);
      list.hidden = !nodes.length;
      count.textContent = log.length || '';
      more.hidden = st.all || log.length <= LOG_CAP;
      more.textContent = `Show ${log.length - LOG_CAP} older`;
      syncAll();
    });

    // Composer: a required one-line summary plus an optional markdown body. It sits outside the keyed
    // list, so live updates never touch it; the draft survives switching cards.
    const sumIn = h('input', { class: 'input', maxLength: 160, required: true, placeholder: 'Summary: what changed or was decided', attrs: { 'aria-label': 'Note summary' } });
    const bodyIn = h('textarea', { class: 'input', rows: 3, maxLength: 32000, placeholder: 'Details in markdown (optional)', attrs: { 'aria-label': 'Note details (markdown)' } });
    const okBtn = h('button', { class: 'btn xs primary', type: 'button', text: 'Add note', on: { click: () => submit() } });
    const comp = h('div', { class: 'note-composer', hidden: true }, sumIn, bodyIn,
      h('div', { class: 'msg-actions' }, h('button', { class: 'btn xs', type: 'button', text: 'Cancel', on: { click: () => closeComposer() } }), okBtn));
    const addBtn = h('button', { class: 'btn xs', type: 'button', on: { click: () => { showComposer(); sumIn.focus(); } } }, icon('plus', 'sm'), 'Add note');
    let posting = false;
    const syncComposer = () => {
      okBtn.disabled = posting || !sumIn.value.trim();
      if (st.draft) st.draft = { summary: sumIn.value, body: bodyIn.value };
    };
    comp.addEventListener('input', syncComposer);
    comp.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeComposer(); }
      else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
      else if (e.target === sumIn && isEnter(e)) { e.preventDefault(); bodyIn.focus(); }
    });
    function showComposer() {
      if (!comp.hidden) return;
      st.draft ||= { summary: '', body: '' };
      sumIn.value = st.draft.summary;
      bodyIn.value = st.draft.body;
      comp.hidden = false;
      syncComposer();
    }
    function closeComposer() {
      const refocus = comp.contains(document.activeElement);
      st.draft = null;
      sumIn.value = bodyIn.value = '';
      comp.hidden = true;
      if (refocus) addBtn.focus({ preventScroll: true });
    }
    async function submit() {
      const summary = sumIn.value.trim(), body = bodyIn.value;
      if (!summary || posting) return;
      posting = true;
      syncComposer();
      const r = await api.lifecycle(id, 'note', { summary, body });
      posting = false;
      // Errors keep the text (write() already toasts and reloads on conflict); so does typing during the save.
      if (r.ok && sumIn.value.trim() === summary && bodyIn.value === body) closeComposer();
      else syncComposer();
    }
    if (st.draft) showComposer();

    return section('Notes', count, [allBtn,
      h('button', { class: 'btn xs', type: 'button', on: { click: () => A.workpad(id) } }, icon('edit', 'sm'), 'Add acceptance template'),
      addBtn], pin, comp, list, more);
  }

  function subtasks(id) {
    const count = counter();
    const list = h('div', { class: 'checklist' });
    let all = false;
    const more = moreBtn(() => { all = true; flush(); });
    const add = onEnterAdd(h('input', { class: 'field', placeholder: 'Add subtask…', attrs: { 'aria-label': 'Add subtask' } }),
      text => editTree(id, tree => { tree.push(newSub(tree, text)); }));
    slot(c => json(c.subtasks) + all, c => {
      const tree = c.subtasks || [];
      const n = countTree(tree);
      put(count, n.total ? [ui.progress(n.done, n.total), `${n.done}/${n.total}`] : null);
      const a = document.activeElement;
      const keep = list.contains(a) && a.classList.contains('box') ? a.parentNode.dataset.sid : null;
      let left = all ? Infinity : SUB_CAP;
      const rows = items => {
        const out = [];
        for (const s of items) {
          if (left-- <= 0) break;
          out.push(row(s));
          if (s.children?.length && !s.collapsed) out.push(h('div', { class: 'check-children' }, rows(s.children)));
        }
        return out;
      };
      put(list, rows(tree));
      if (keep) list.querySelector(`[data-sid="${CSS.escape(keep)}"] > .box`)?.focus({ preventScroll: true });
      more.hidden = all || n.shown <= SUB_CAP;
      more.textContent = `Show all ${n.shown}`;
    }, { busy: () => {
      const a = document.activeElement;
      return (list.contains(a) && a.tagName === 'TEXTAREA') || [...list.querySelectorAll('textarea')].some(isDirty);
    } });
    list.addEventListener('focusout', e => { if (!list.contains(e.relatedTarget)) flush(); });

    function row(s) {
      const kids = s.children || [];
      const text = h('textarea', { class: 'text', rows: 1, attrs: { 'aria-label': 'Subtask' } });
      setBase(text, s.text);
      bindText(text, v => editTree(id, tree => { const node = nodeOf(tree, s.id); if (!node) return false; node.text = v; }), { enter: true, required: true });
      const box = h('button', { class: 'box', type: 'button', attrs: { role: 'checkbox', 'aria-checked': String(!!s.done), 'aria-label': s.text || 'Subtask' },
        on: { click: () => toggle(s.id, el, box) } }, icon('check'));
      const el = h('div', { class: s.done ? 'check-row done' : 'check-row', dataset: { sid: s.id } }, box, text,
        kids.length ? iconBtn(s.collapsed ? 'right' : 'down', s.collapsed ? `Show ${kids.length} sub-items` : 'Hide sub-items',
          () => editTree(id, tree => { const node = nodeOf(tree, s.id); if (!node) return false; node.collapsed = !node.collapsed; })) : null,
        h('span', { class: 'row-tools' },
          iconBtn('plus', 'Add sub-item', () => addChild(s.id, el)),
          iconBtn('trash', 'Delete subtask', () => remove(s))));
      return el;
    }
    function toggle(sid, el, box) {
      const done = !el.classList.contains('done');
      const show = on => { el.classList.toggle('done', on); box.setAttribute('aria-checked', String(on)); };
      show(done);
      editTree(id, tree => { const node = nodeOf(tree, sid); if (!node) return false; node.done = done; node.doneAt = done ? now() : null; })
        .then(r => { if (!r.ok) show(!done); });
    }
    // A local draft row under the parent; it becomes a real subtask once it has text.
    function addChild(sid, el) {
      let kids = el.nextElementSibling;
      if (!kids?.classList.contains('check-children')) el.after(kids = h('div', { class: 'check-children' }));
      const text = h('textarea', { class: 'text', rows: 1, placeholder: 'Sub-item', attrs: { 'aria-label': 'New sub-item' } });
      bases.set(text, '');
      const draft = h('div', { class: 'check-row' }, h('span', { class: 'box' }), text);
      kids.append(draft);
      text.focus();
      text.addEventListener('keydown', e => { if (isEnter(e)) { e.preventDefault(); text.blur(); } });
      text.addEventListener('blur', async () => {
        const v = text.value.trim();
        if (!v) { draft.remove(); flush(); return; }
        text.removeAttribute('aria-invalid');
        const r = await editTree(id, tree => {
          const node = nodeOf(tree, sid);
          if (!node) return false;
          (node.children ||= []).push(newSub(tree, v));
          node.collapsed = false;
        });
        if (!r.ok) { text.setAttribute('aria-invalid', 'true'); return; }
        draft.remove();
        flush();
      });
    }
    async function remove(s) {
      const n = countTree(s.children).total;
      if (n && !await ui.confirm({ title: 'Delete subtask?', body: `“${s.text}” and its ${n} sub-item${n === 1 ? '' : 's'} will be removed.`, ok: 'Delete', danger: true })) return;
      editTree(id, tree => { const hit = locate(tree, s.id); if (!hit) return false; hit.list.splice(hit.i, 1); });
    }
    return section('Subtasks', count, null, list, more, add);
  }

  function attachments(id) {
    const count = counter();
    const list = h('div', {});
    slot(c => json(c.attachments), c => {
      const files = c.attachments || [];
      count.textContent = files.length || '';
      put(list, files.map(a => h('div', { class: 'file-row' },
        h('span', { class: 'ic' }, icon('file')),
        h('div', { class: 'main' },
          h('a', { class: 'name', href: api.attachmentUrl(id, a.id), download: a.name, title: a.name, text: a.name }),
          h('div', { class: 'meta', text: [fmtSize(a.size || 0), a.by, ui.relTime(a.createdAt)].filter(Boolean).join(' · ') })),
        iconBtn('x', `Remove ${a.name}`, async () => {
          if (await ui.confirm({ title: `Remove ${a.name}?`, body: 'The file will be detached from this card.', ok: 'Remove', danger: true })) api.detach(id, a.id);
        }))));
    });
    return section('Attachments', count,
      h('button', { class: 'btn xs', type: 'button', on: { click: () => fileInput.click() } }, icon('clip', 'sm'), 'Attach'), list);
  }

  function activity() {
    const count = counter();
    const list = h('ul', { class: 'activity' });
    let all = false;
    const more = moreBtn(() => { all = true; flush(); });
    slot(c => json(c.history) + all, c => {
      const events = (c.history || []).slice().reverse();
      count.textContent = events.length || '';
      put(list, (all ? events : events.slice(0, HIST_CAP)).map(e => h('li', {}, when(e.at), h('span', { text: describe(e) }))));
      more.hidden = all || events.length <= HIST_CAP;
      more.textContent = `Show all ${events.length}`;
    });
    return section('Activity', count, null, list, more);
  }

  function discussion(id) {
    const count = counter();
    const thread = h('div', { class: 'thread' });
    let all = false;
    const more = moreBtn(() => { all = true; flush(); });
    slot(c => json(c.comments) + all, c => {
      const list = c.comments || [];
      count.textContent = list.length || '';
      put(thread, (all ? list : list.slice(-MSG_CAP)).map(m => message(m)));
      more.hidden = all || list.length <= MSG_CAP;
      more.textContent = `Show all ${list.length}`;
    }, { busy: () => !!thread.querySelector('textarea') });

    function message(m) {
      const text = h('div', { class: 'msg-text', text: m.text });
      return h('div', { class: 'msg' }, ui.avatar(m.by || '?'),
        h('div', { class: 'msg-body' },
          h('div', { class: 'msg-head' },
            h('b', { text: m.by || 'Unknown' }), when(m.at),
            m.updatedAt ? h('span', { title: `Edited ${ui.fmtDateTime(m.updatedAt)}${m.updatedBy ? ` by ${m.updatedBy}` : ''}`, text: 'edited' }) : null,
            h('span', { class: 'msg-tools' },
              iconBtn('edit', 'Edit comment', () => editMessage(m, text)),
              iconBtn('trash', 'Delete comment', async () => {
                if (await ui.confirm({ title: 'Delete comment?', body: 'It will be removed for everyone.', ok: 'Delete', danger: true })) api.comment(id, { type: 'delete', id: m.id });
              }))),
          text));
    }
    function editMessage(m, textEl) {
      if (textEl.hidden) return;
      const input = h('textarea', { class: 'field', attrs: { 'aria-label': 'Edit comment' } });
      input.value = m.text;
      const close = () => { box.remove(); textEl.hidden = false; flush(); };
      const save = async () => {
        const text = input.value.trim();
        if (!text) return;
        if (text === m.text) { close(); return; }
        ok.disabled = true;
        const r = await api.comment(id, { type: 'edit', id: m.id, text });
        ok.disabled = false;
        if (r.ok) close(); else input.setAttribute('aria-invalid', 'true');
      };
      const ok = h('button', { class: 'btn xs primary', type: 'button', text: 'Save', on: { click: save } });
      const box = h('div', {}, input, h('div', { class: 'msg-actions' }, h('button', { class: 'btn xs', type: 'button', text: 'Cancel', on: { click: close } }), ok));
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });
      textEl.hidden = true;
      textEl.after(box);
      input.focus();
    }
    return section('Discussion', count, null, more, thread);
  }

  // ── Public API ──────────────────────────────────────────────────────
  function open(id) {
    const card = WB.card(id);
    if (!card) return;
    if (!panel) skeleton();
    const wasOpen = panel.classList.contains('open');
    clearTimeout(closeTimer);
    panel.classList.remove('closing');
    if (cur?.id === card.id) update();
    else {
      const a = document.activeElement;
      if (body.contains(a)) a.blur(); // commits an edit in progress to the card it belongs to
      if (cur) { if (composer.value.trim()) drafts.set(cur.id, composer.value); else drafts.delete(cur.id); }
      composer.value = drafts.get(card.id) || '';
      syncSend();
      cur?.gone?.remove();
      cur = { id: card.id, card, slots: [], title: null, gone: null };
      // A fresh body element: scroll starts at the top without a layout read, and `.swap` replays its fade.
      const next = h('div', { class: wasOpen ? 'panel-body swap' : 'panel-body' }, build(card));
      render(card);
      body.replaceWith(next);
      body = next;
    }
    cancelAnimationFrame(prepFrame);
    if (wasOpen) panel.classList.add('open');
    else {
      // Frame N lays out and paints the new content off-screen; frame N+1 starts a compositor-only slide.
      panel.classList.add('preparing');
      prepFrame = requestAnimationFrame(() => {
        prepFrame = requestAnimationFrame(() => { panel.classList.remove('preparing'); panel.classList.add('open'); });
      });
    }
    // ponytail: a 5 s createdAt window stands in for a "just created" flag (the new-card and follow-up
    // flows open the card at once); pass an explicit flag from core if others' fresh cards steal focus.
    const fresh = Date.now() - Date.parse(card.createdAt) < 5000;
    const target = fresh ? cur.title : panel;
    // Focusing forces a synchronous layout of the new content; do it after the slide-in so the
    // animation's first frames only composite.
    setTimeout(() => {
      if (cur?.id !== card.id || !panel.classList.contains('open')) return;
      target.focus({ preventScroll: true });
      if (fresh) target.setSelectionRange(target.value.length, target.value.length);
    }, wasOpen ? 0 : 340);
  }

  const endClose = () => { clearTimeout(closeTimer); panel.classList.remove('closing'); };
  function close() {
    if (!panel) return;
    const a = document.activeElement;
    if (panel.contains(a)) a.blur(); // saves a field being edited
    cancelAnimationFrame(prepFrame);
    panel.classList.remove('preparing');
    if (!panel.classList.contains('open')) return;
    panel.classList.remove('open', 'drop-files');
    panel.classList.add('closing');
    clearTimeout(closeTimer);
    closeTimer = setTimeout(endClose, 300);
  }

  function update() {
    if (!cur) return;
    const card = WB.card(cur.id);
    if (!card) { showGone(); return; }
    if (cur.gone) { cur.gone.remove(); cur.gone = null; cur.card = null; }
    if (card === cur.card) return;
    // Unchanged card content (same changedRev): only parts that show other cards can differ.
    const crossOnly = card.changedRev != null && card.changedRev === cur.card?.changedRev;
    cur.card = card;
    render(card, crossOnly);
  }
  // Shown between the bar and the body so it stays visible at any scroll position.
  function showGone() {
    if (cur.gone) return;
    cur.gone = h('div', { class: 'banner panel-msg', attrs: { role: 'status' } },
      h('span', { text: 'This card was deleted or is no longer on this board.' }),
      h('button', { class: 'btn sm outline', type: 'button', text: 'Close', on: { click: () => WB.closeCard() } }));
    body.before(cur.gone);
  }

  WB.panel = { open, close, update };
})();

/* ── Secondary views: Ready now · Rework · Canceled · Insights · Git · Calendar ── */
(() => {
  const h = (...a) => WB.ui.h(...a);
  const icon = (name, cls) => WB.ui.icon(name, cls);

  // Server-backed data survives view switches; `cur` is the one mounted view.
  const PATHS = {ready: 'api/ready', insights: 'api/stats', git: 'api/git'};
  const VALID = {
    ready: d => Array.isArray(d && d.cards),
    insights: d => !!d && !!d.stats && typeof d.stats === 'object',
    git: d => !!d && typeof d.state === 'string',
  };
  const store = {ready: {}, insights: {}, git: {}};   // {data, error, busy, again, timer, at}
  const cal = {month: null, filter: 'all'};           // calendar state lives in memory only
  let cur = null;                                     // {name, host, body, head, sig, …}

  const active = kind => !!cur && cur.name === kind && cur.host.isConnected;
  const errText = e => (e && e.message) || 'Request failed';
  const tone = (el, value) => { el.style.setProperty('--tone', value); return el; };
  const rev = c => c.changedRev ?? c.updatedAt;
  const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const toDate = iso => { const t = Date.parse(iso); return Number.isFinite(t) ? new Date(t) : null; };
  const pct = (n, max) => `${Math.round(n / max * 1000) / 10}%`;
  const fmt = n => (n == null ? '—' : String(n));

  // ── Server data: fetch on render, throttle refetch after doc events (≥ 1 s) ──
  function load(kind) {
    const s = store[kind];
    clearTimeout(s.timer); s.timer = 0;
    if (s.busy) { s.again = true; return; }
    s.busy = true; s.again = false;
    if (active(kind)) VIEWS[kind].paint();
    Promise.resolve()
      .then(() => WB.api.get(PATHS[kind]))
      .then(d => {
        if (!VALID[kind](d)) throw new Error(`Unexpected response from ${PATHS[kind]}`);
        s.data = d; s.error = null; s.at = new Date();
      })
      .catch(e => { s.error = e; })
      .then(() => {
        s.busy = false;
        if (!active(kind)) return;
        if (s.again) load(kind); else VIEWS[kind].paint();
      });
  }
  function schedule(kind) {
    const s = store[kind];
    if (!s.timer) s.timer = setTimeout(() => { s.timer = 0; if (active(kind)) load(kind); }, 1000);
  }

  // ── Shared building blocks ──
  function mount(title, desc, tools) {
    const h1 = h('h1', {text: title}), p = h('p', {text: desc});
    const el = h('div', {class: 'view-head'}, h('div', {}, h1, p), tools ? h('div', {class: 'tools'}, tools) : null);
    cur.head = {el, h1, p};
    cur.body = h('div', {});
    cur.host.replaceChildren(el, cur.body);
  }
  // Replace the body only when its signature changed; keep keyboard focus on the same card.
  function show(sig, build) {
    if (sig === cur.sig) return;
    cur.sig = sig;
    const body = cur.body, a = document.activeElement;
    const holder = a && a !== body && body.contains(a) ? a.closest('[data-vid]') : null;
    body.replaceChildren(...[].concat(build()).filter(Boolean));
    if (holder) body.querySelector(`[data-vid="${CSS.escape(holder.dataset.vid)}"]`)?.focus({preventScroll: true});
  }
  const empty = (ic, title, msg, action) =>
    h('div', {class: 'empty'}, icon(ic), h('b', {text: title}), msg ? h('span', {text: msg}) : null, action || null);
  const retry = kind => h('button', {class: 'btn sm outline', type: 'button', on: {click: () => load(kind)}}, 'Retry');
  const staleNote = (kind, e) => h('div', {class: 'banner error', attrs: {role: 'alert'}},
    icon('info'), h('span', {text: `Couldn't refresh, showing the last result. ${errText(e)}`}), retry(kind));
  // Loading / failed states while a server-backed view has no data yet. Returns true when it painted one.
  function noData(kind, failTitle) {
    const s = store[kind];
    if (s.data) return false;
    if (s.error && !s.busy) show(`fail:${errText(s.error)}`, () => empty(kind, failTitle, errText(s.error), retry(kind)));
    else show('loading', () => h('div', {class: 'empty', attrs: {'aria-busy': 'true'}}, h('span', {text: 'Loading…'})));
    return true;
  }
  const block = (title, aside, ...content) => h('section', {class: 'card-block'},
    h('h2', {}, title, aside ? h('span', {class: 'aside', text: aside}) : null), content);
  const note = text => h('p', {class: 'view-note', text});

  // ── Card grids: Ready now · Rework · Canceled ──
  function cardGrid(cards, reason) {
    const sel = WB.state.selectedId;
    return h('div', {class: 'grid-cards'}, cards.map(c => {
      const el = WB.ui.renderCard(c);
      el.dataset.vid = c.id;
      el.classList.toggle('selected', c.id === sel);
      const text = reason && c[reason.field];
      if (text) el.append(tone(h('div', {class: 'card-note', title: text, text}), reason.tone));
      return el;
    }));
  }
  function cardList(all, def, kind) {
    const shown = all.filter(c => WB.matches(c)), err = kind && store[kind].error;
    const sig = `${err ? errText(err) : ''}|${all.length}|${shown.map(c => `${c.id}:${rev(c)}`).join(',')}`;
    show(sig, () => [
      err && staleNote(kind, err),
      shown.length ? cardGrid(shown, def.reason)
        : all.length ? empty('filter', 'No matching cards',
          `${all.length} ${all.length === 1 ? 'card is' : 'cards are'} hidden by the current filters or search.`)
        : empty(def.icon, def.none, def.hint),
    ]);
  }

  const READY = {icon: 'ready', none: 'Nothing is ready', hint: 'Unowned Task cards whose prerequisites are complete will appear here.'};
  function paintReady() {
    if (noData('ready', "Couldn't load ready cards")) return;
    // Server order; drop cards the live document says are gone, claimed or moved (refetch follows).
    const all = store.ready.data.cards.map(c => WB.card(c && c.id)).filter(c => c && c.column === 'task' && !c.activeOwner);
    cardList(all, READY, 'ready');
  }

  const LISTS = {
    rework: {
      title: 'Rework', desc: 'Cards sent back for another pass, with the reason on each.',
      pick: c => !!c.reworkReason && c.column !== 'done', reason: {field: 'reworkReason', tone: 'var(--amber)'},
      icon: 'rework', none: 'No rework', hint: 'Cards returned for another pass will appear here.',
    },
    canceled: {
      title: 'Canceled', desc: "Closed without completion. Canceled prerequisites don't unlock dependent work.",
      pick: c => c.outcome === 'canceled', reason: {field: 'cancelReason', tone: 'var(--fg-2)'},
      icon: 'canceled', none: 'Nothing canceled', hint: 'Cards closed without completion will be listed here.',
    },
  };
  function listView(kind) {
    const def = LISTS[kind], paint = () => cardList(WB.cards().filter(def.pick), def);
    return {render() { mount(def.title, def.desc); paint(); }, paint, update: paint};
  }

  // ── Insights ──
  const KPIS = [
    ['total', 'Total'], ['open', 'Open'], ['ready', 'Ready now'], ['inprogress', 'In progress', 'var(--amber)'],
    ['blocked', 'Blocked', 'var(--red)'], ['completed', 'Completed', 'var(--green)'], ['canceled', 'Canceled'],
    ['rework', 'In rework'], ['completedLast7Days', 'Completed · 7 days'],
  ];
  const PRIOS = [['critical', 'Critical', 'var(--red)'], ['mid', 'Mid', 'var(--amber)'], ['low', 'Low', 'var(--fg-2)'], ['unset', 'No priority', 'var(--fg-4)']];

  function bars(rows, still) {
    const max = Math.max(1, ...rows.map(r => r.n));
    return h('div', {class: 'bars'}, rows.map(r => {
      const fill = h('div', {class: 'fill', style: {width: pct(r.n, max)}});
      if (still) fill.style.animation = 'none';
      if (r.status) fill.dataset.status = r.status; else if (r.tone) tone(fill, r.tone);
      return h('div', {class: 'bar-row'},
        h('div', {class: 'l', title: r.label}, r.avatar ? WB.ui.avatar(r.label) : null, h('span', {text: r.label})),
        h('div', {class: 'track'}, fill),
        h('div', {class: 'n', text: String(r.n)}));
    }));
  }
  function last14() {
    const now = new Date(), days = [], index = new Map();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      index.set(dayKey(d), days.length);
      days.push(d);
    }
    const counts = days.map(() => 0);
    for (const c of WB.cards()) {
      if (c.outcome !== 'completed') continue;
      const d = toDate(c.doneAt), i = d && index.get(dayKey(d));
      if (i != null) counts[i]++;
    }
    return {days, counts, total: counts.reduce((a, b) => a + b, 0), today: dayKey(now)};
  }
  function histogram({days, counts, total}, still) {
    const max = Math.max(1, ...counts);
    return h('div', {class: 'hist', attrs: {role: 'img', 'aria-label': `${total} completed in the last 14 days`}}, days.map((d, i) => {
      const bar = h('div', {class: counts[i] ? 'hist-bar' : 'hist-bar zero', style: {height: pct(counts[i], max)}});
      if (still) bar.style.animation = 'none';
      const label = d.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'});
      return h('div', {class: i === 13 ? 'hist-col today' : 'hist-col', title: `${label} · ${counts[i]} completed`},
        h('div', {class: 'hist-track'}, bar), h('span', {class: 'd', text: String(d.getDate())}));
    }));
  }
  function paintInsights() {
    if (noData('insights', "Couldn't load insights")) return;
    const s = store.insights, st = s.data.stats, hist = last14(), cols = WB.columns();
    const names = cols.map(c => WB.colName(c.id));
    const sig = JSON.stringify([st, hist.counts, hist.today, names, s.error ? errText(s.error) : '']);
    show(sig, () => {
      const still = !!cur.painted;   // bars grow on first paint only; live refreshes just snap
      cur.painted = true;
      const owners = Object.entries(st.byOwner || {}).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const owned = owners.reduce((n, o) => n + o[1], 0);
      return [
        s.error && staleNote('insights', s.error),
        h('div', {class: 'kpis'}, KPIS.map(([k, label, t]) => {
          const el = h('div', {class: 'kpi'}, h('div', {class: 'v', text: fmt(st[k])}), h('div', {class: 'l', text: label}));
          return t ? tone(el, t) : el;
        })),
        h('div', {class: 'vgrid'},
          block('Workflow', `${fmt(st.total)} cards`,
            bars(cols.map((c, i) => ({label: names[i], n: (st.byColumn || {})[c.id] || 0, status: c.id})), still)),
          block('Priority', null,
            bars(PRIOS.map(([k, label, t]) => ({label, n: (st.byPriority || {})[k] || 0, tone: t})), still)),
          block('Owners', owners.length ? `${owned} in progress` : null,
            owners.length
              ? bars(owners.slice(0, 8).map(([label, n]) => ({label, n, avatar: true})), still)
              : h('p', {class: 'block-note', text: 'Nobody owns an in-progress card right now.'}),
            owners.length > 8 ? h('p', {class: 'block-note', text: `+${owners.length - 8} more owners`}) : null),
          block('Completed · last 14 days', `${hist.total} completed`, histogram(hist, still))),
      ];
    });
  }

  // ── Git (fetched on render and on Refresh only) ──
  const GIT_DESC = 'Read-only working tree status of the project repository.';
  const GIT_BAD = {not_repo: 'Not a Git repository', unavailable: 'Git is unavailable', error: "Couldn't read Git status"};

  function renderGit() {
    cur.refreshLabel = h('span', {text: 'Refresh'});
    mount('Git', GIT_DESC, h('button', {class: 'btn sm outline', type: 'button', on: {click: () => store.git.busy || load('git')}},
      icon('reset', 'sm'), cur.refreshLabel));
    paintGit();
    load('git');
  }
  function aheadBehind(g) {
    if (g.ahead == null) return 'No upstream';
    return g.ahead || g.behind ? `${g.ahead} ahead · ${g.behind} behind` : 'Up to date';
  }
  function gitSummary(g) {
    const state = tone(h('span', {class: 'badge', text: g.state === 'clean' ? 'Clean' : 'Uncommitted changes'}),
      g.state === 'clean' ? 'var(--green)' : 'var(--amber)');
    return h('section', {class: 'card-block'},
      h('div', {class: 'git-line'},
        h('span', {class: 'chip lg', title: 'Branch'}, icon('branch', 'sm'), g.branch || 'Detached HEAD'),
        g.head ? h('span', {class: 'mono faint', title: g.head, text: g.head.slice(0, 7)}) : h('span', {class: 'faint', text: 'No commits yet'}),
        g.subject ? h('span', {class: 'git-subject', title: g.subject, text: g.subject}) : null,
        h('span', {class: 'faint', text: aheadBehind(g)}),
        state),
      g.root ? h('div', {class: 'git-root mono faint', title: g.root, text: g.root}) : null,
      h('div', {class: 'git-counts'}, ['staged', 'unstaged', 'untracked', 'conflicted'].map(k => {
        const chip = h('span', {class: 'chip lg'}, `${g[k] ?? 0} ${k}`);
        if (k === 'conflicted' && g[k] > 0) chip.style.color = 'var(--red)';
        return chip;
      })));
  }
  function gitFiles(g) {
    const files = g.files || [];
    if (!files.length) return empty('check', 'Working tree clean', 'No staged, unstaged or untracked files.');
    return h('div', {class: 'list'}, files.map(f => h('div', {class: 'list-row'},
      h('span', {class: 'mono git-code', title: 'index · worktree', text: `${f.index || '.'}${f.worktree || '.'}`}),
      h('span', {class: 'git-path', title: f.path, text: f.path}))));
  }
  function paintGit() {
    const s = store.git;
    cur.refreshLabel.textContent = s.busy ? 'Refreshing…' : 'Refresh';
    cur.head.p.textContent = s.at
      ? `${GIT_DESC} Checked ${s.at.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'})}.`
      : GIT_DESC;
    if (noData('git', "Couldn't read Git status")) return;
    const g = s.data, err = s.error;
    show(JSON.stringify([g, err ? errText(err) : '']), () => [
      err && staleNote('git', err),
      ...(GIT_BAD[g.state]
        ? [empty('git', GIT_BAD[g.state], g.error || '')]
        : [gitSummary(g), gitFiles(g), g.truncated && note(`Showing the first ${(g.files || []).length} changed files.`), g.warning && note(g.warning)]),
    ]);
  }

  // ── Calendar ──
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const CAL_FILTERS = [
    ['all', 'All', () => true],
    ['open', 'Open', c => c.column !== 'done'],
    ['done', 'Done', c => c.column === 'done'],
    ['critical', 'Critical', c => c.priority === 'critical'],
  ];
  const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);

  function renderCal() {
    if (!cal.month) cal.month = monthStart(new Date());
    cur.seg = h('div', {class: 'seg', attrs: {role: 'group', 'aria-label': 'Show cards'}}, CAL_FILTERS.map(([k, label]) =>
      h('button', {class: 'btn xs', type: 'button', dataset: {f: k}, on: {click: () => { cal.filter = k; paintCal(); }}}, label)));
    const step = (ic, label, n) => h('button', {class: 'btn icon sm', type: 'button', title: label, attrs: {'aria-label': label}, on: {click: () => shift(n)}}, icon(ic));
    mount('', '', [cur.seg, h('div', {class: 'cal-nav'},
      step('left', 'Previous month', -1),
      h('button', {class: 'btn sm outline', type: 'button', on: {click: () => shift(0)}}, 'Today'),
      step('right', 'Next month', 1))]);
    cur.head.el.classList.add('cal-head');
    paintCal();
  }
  function shift(n) {
    const m = cal.month;
    cal.month = n ? new Date(m.getFullYear(), m.getMonth() + n, 1) : monthStart(new Date());
    paintCal();
  }
  function calEvent(c) {
    const canceled = c.outcome === 'canceled', title = c.title || 'Untitled';
    const b = h('button', {
      class: canceled ? 'cal-ev canceled' : 'cal-ev', type: 'button', title: `#${c.num} ${title}`,
      dataset: {status: c.column, vid: c.id}, on: {click: () => WB.openCard(c.id)},
    }, h('span', {class: 'ref', text: `#${c.num}`}), h('span', {class: 't', text: title}));
    return canceled ? tone(b, 'var(--gray)') : b;
  }
  function calMore(cards) {
    const items = () => cards.map(c => ({label: c.title || 'Untitled', hint: `#${c.num}`, run: () => WB.openCard(c.id)}));
    return h('button', {class: 'cal-more', type: 'button', attrs: {'aria-haspopup': 'menu'}, on: {click: e => WB.ui.menu(e.currentTarget, items())}},
      `+${cards.length} more`);
  }
  function calDay(d, mo, today, byDay) {
    const k = dayKey(d), evs = (byDay.get(k) || []).sort((a, b) => a[0] - b[0]);
    return h('div', {class: `cal-day${d.getMonth() !== mo ? ' out' : ''}${k === today ? ' today' : ''}`},
      h('span', {class: 'd', text: String(d.getDate())}),
      evs.slice(0, 3).map(e => calEvent(e[1])),
      evs.length > 3 ? calMore(evs.slice(3).map(e => e[1])) : null);
  }
  function paintCal() {
    const m = cal.month, y = m.getFullYear(), mo = m.getMonth();
    const offset = (m.getDay() + 6) % 7;                                   // Monday-first
    const cells = Math.ceil((offset + new Date(y, mo + 1, 0).getDate()) / 7) * 7;
    const first = new Date(y, mo, 1 - offset), after = new Date(y, mo, 1 - offset + cells);
    const pass = (CAL_FILTERS.find(f => f[0] === cal.filter) || CAL_FILTERS[0])[2];
    const today = dayKey(new Date()), byDay = new Map(), sig = [y, mo, cal.filter, today];
    let created = 0, shipped = 0;
    for (const c of WB.cards()) {
      if (!pass(c)) continue;
      const born = toDate(c.createdAt), done = c.column === 'done' ? toDate(c.doneAt) : null, at = done || born;
      if (born && born.getFullYear() === y && born.getMonth() === mo) created++;
      if (done && c.outcome === 'completed' && done.getFullYear() === y && done.getMonth() === mo) shipped++;
      if (!at || at < first || at >= after) continue;
      const k = dayKey(at), list = byDay.get(k);
      if (list) list.push([at, c]); else byDay.set(k, [[at, c]]);
      sig.push(c.id, rev(c));
    }
    sig.push(created, shipped);
    show(sig.join('|'), () => {
      cur.head.h1.textContent = m.toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
      cur.head.p.textContent = `${created} created · ${shipped} shipped`;
      for (const b of cur.seg.children) b.setAttribute('aria-pressed', String(b.dataset.f === cal.filter));
      return h('div', {class: 'cal-grid'},
        DOW.map(name => h('div', {class: 'cal-dow', text: name})),
        Array.from({length: cells}, (_, i) => calDay(new Date(y, mo, 1 - offset + i), mo, today, byDay)));
    });
  }

  // ── Registry ──
  const VIEWS = {
    ready: {
      render() { mount('Ready now', 'Unowned Task cards whose prerequisites are complete — highest priority first.'); paintReady(); load('ready'); },
      paint: paintReady,
      update() { paintReady(); schedule('ready'); },
    },
    rework: listView('rework'),
    canceled: listView('canceled'),
    insights: {
      render() { mount('Insights', 'Live summary of this board.'); paintInsights(); load('insights'); },
      paint: paintInsights,
      update() { paintInsights(); schedule('insights'); },
    },
    git: {render: renderGit, paint: paintGit, update() {}},   // never refetched automatically
    calendar: {render: renderCal, paint: paintCal, update: paintCal},
  };
  const viewFor = name => (Object.prototype.hasOwnProperty.call(VIEWS, name) ? VIEWS[name] : null);

  function render(name, host) {
    cur = {name, host, sig: null};
    const v = viewFor(name);
    if (v) v.render();
    else host.replaceChildren(empty('info', 'Nothing to show', `There is no "${name}" view.`));
  }
  function update(name, host) {
    if (!cur || cur.host !== host || cur.name !== name) return render(name, host);
    const v = viewFor(name);
    if (v) v.update();
  }

  // Core only marks its own board cards; keep the open card highlighted in view grids too.
  WB.on('select', id => {
    if (!cur || !cur.host.isConnected) return;
    for (const el of cur.host.querySelectorAll('.card[data-vid]')) el.classList.toggle('selected', el.dataset.vid === id);
  });

  WB.views = {render, update};
})();

WB._boot();

</script>
</body>
</html>
