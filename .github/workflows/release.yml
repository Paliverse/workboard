name: Release

on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: verify + all six binaries, no GitHub Release, no npm publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, changelog and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must equal workboard.__version__
        id: version
        run: |
          version="$(PYTHONPATH=src python -c 'import workboard; print(workboard.__version__)')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workboard.__version__ $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/build.py notes --version "$VERSION"
      - run: python -m unittest discover -s tests -t .

  binaries:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
          # 22.04 keeps the glibc floor at 2.35 for the Linux binaries.
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python packaging/build.py binary
      - name: Smoke-test the archive
        shell: bash
        run: python packaging/build.py smoke dist/workboard-${{ matrix.target }}.*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/workboard-${{ matrix.target }}.*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Add install scripts and SHA256SUMS
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          python packaging/build.py checksums dist
          cat dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python packaging/build.py notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "WorkBoard $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  npm:
    name: npm
    if: github.event_name == 'push'
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/workboard
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: python packaging/build.py npm --version "$VERSION"
      - name: Publish (platform packages first, then workboard)
        env:
          # Empty when npm trusted publishing is configured; npm then authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm only accepts provenance from a public repository.
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          provenance=--provenance
          if [ "$PRIVATE_REPO" = "true" ]; then
            provenance=
            echo "::warning::Private repository: publishing without provenance (npm requires a public repository)"
          fi
          packages="workboard-win32-x64 workboard-win32-arm64 workboard-darwin-x64 workboard-darwin-arm64 workboard-linux-x64 workboard-linux-arm64 workboard"
          for name in $packages; do
            test -f "build/npm/$name/package.json" || { echo "::error::build/npm/$name was not built"; exit 1; }
          done
          for name in $packages; do
            # `npm view` exits 0 with empty output when the package exists but the version does not.
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already published"
            else
              npm publish "build/npm/$name" $provenance --access public
            fi
          done
