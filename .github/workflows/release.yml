name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, changelog and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must equal workboard.__version__
        id: version
        run: |
          version="$(PYTHONPATH=src python -c 'import workboard; print(workboard.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workboard.__version__ $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/build.py notes --version "$VERSION"
      - run: python -m unittest discover -s tests -t .

  binaries:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
          # 22.04 keeps the glibc floor at 2.35 for the Linux binaries.
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python packaging/build.py binary
      - name: Smoke-test the archive
        shell: bash
        run: python packaging/build.py smoke dist/workboard-${{ matrix.target }}.*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/workboard-${{ matrix.target }}.*
          if-no-files-found: error

  python:
    name: sdist and wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, binaries, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Add install scripts and SHA256SUMS
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          python packaging/build.py checksums dist
          cat dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python packaging/build.py notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "WorkBoard $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/workboard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true  # a re-run after a partial failure must not fail on files already uploaded

  npm:
    name: npm
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/workboard
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: python packaging/build.py npm --version "$VERSION"
      - name: Publish (platform packages first, then workboard)
        env:
          # Empty when npm trusted publishing is configured; npm then authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          packages="workboard-win32-x64 workboard-win32-arm64 workboard-darwin-x64 workboard-darwin-arm64 workboard-linux-x64 workboard-linux-arm64 workboard"
          for name in $packages; do
            test -f "build/npm/$name/package.json" || { echo "::error::build/npm/$name was not built"; exit 1; }
          done
          for name in $packages; do
            # `npm view` exits 0 with empty output when the package exists but the version does not.
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already published"
            else
              npm publish "build/npm/$name" --provenance --access public
            fi
          done

  manifests:
    name: Homebrew formula and Scoop manifest
    needs: [verify, github-release]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: build
      - run: python packaging/build.py manifests --version "$VERSION" --sums build/SHA256SUMS
      - name: Install and test the formula from a throwaway local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new --no-git workboard-ci/local
          tap="$(brew --repository workboard-ci/local)"
          mkdir -p "$tap/Formula"
          cp build/manifests/workboard.rb "$tap/Formula/workboard.rb"
          brew install workboard-ci/local/workboard
          brew test workboard-ci/local/workboard
      - name: Commit Formula/workboard.rb and bucket/workboard.json to main
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          mkdir -p Formula bucket
          cp build/manifests/workboard.rb Formula/workboard.rb
          cp build/manifests/workboard.json bucket/workboard.json
          git add Formula/workboard.rb bucket/workboard.json
          if git diff --cached --quiet; then echo "Formula/workboard.rb and bucket/workboard.json already at $VERSION"; exit 0; fi
          git commit -m "manifests: workboard $VERSION"
          if ! git push origin HEAD:main; then
            echo "main moved; rebasing once and retrying"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  winget:
    name: winget
    needs: [verify, github-release]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check for WINGET_TOKEN
        id: gate
        shell: bash
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::WINGET_TOKEN is not set; skipping the winget submission"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: build
      - name: Submit the manifests to microsoft/winget-pkgs
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          python packaging/build.py manifests --version $env:VERSION --sums build/SHA256SUMS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = 'build/wingetcreate.exe'
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') {
            throw 'wingetcreate.exe checksum mismatch'
          }
          & $exe submit --no-open --prtitle "New version: Paliverse.WorkBoard version $env:VERSION" build/manifests/winget
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
